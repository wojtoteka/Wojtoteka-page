<body>
<canvas id="game" width="960" height="540"></canvas>
<script>
'use strict';
/* ============================================================
   BŁYSTKA i MORZE ATRAMENTU — papierowa gra wędkarska 2D
   Siostrzana opowieść ze świata Trybki. Grafika i dźwięk z kodu.
   Zasada połowu: w dół UNIKASZ ryb (głębiej = cenniej),
   w górę ŁAPIESZ wszystko po drodze.
   Sterowanie: ←→/AD ruch, SPACJA/W zarzucenie i zryw,
   S/↓ szybsze opadanie, ESC pauza.
   ============================================================ */

// ---------- STAŁE ----------
const VH   = 540;         // wysokość logiczna
// szerokość logiczna dopasowywana NA BIEŻĄCO do proporcji ekranu (patrz fitCanvas)
// — dzięki temu obraz zawsze wypełnia cały ekran, bez pasków po bokach
const VW_MIN = 960, VW_MAX = 1600;
let VW = 960;
const DT   = 1/60;        // stały krok fizyki
const SURF = 150;         // linia wody (współrzędna świata)

// fizyka haczyka i łódki
const SINK      = 190;    // opadanie haczyka
const SINK_FAST = 305;    // opadanie z wciśniętym ↓
const SINK_ACC  = 620;
const STEER_ACC = 1650;   // sterowanie w wodzie
const STEER_MAX = 330;
const STEER_DRAG= 1150;
const REEL_V    = 350;    // zwijanie żyłki
const REEL_ACC  = 980;
const BOAT_V    = 180;    // łódka na powierzchni
const BOAT_ACC  = 980;
const DASH_V    = 545;    // zryw (unik) — od 2. łowiska
const DASH_T    = 0.15;
const DASH_CD   = 0.85;
const HOOK_R    = 11;     // promień chwytu haczyka

// ---------- NARZĘDZIA ----------
const clamp = (v,a,b)=> v<a?a : v>b?b : v;
const lerp  = (a,b,t)=> a+(b-a)*t;
// polska odmiana liczebnika: 1 → one, 2-4 → few, 5+ (i 12-14) → many
function plForm(n,one,few,many){
  const d10=n%10, d100=n%100;
  if(n===1) return one;
  if(d10>=2 && d10<=4 && !(d100>=12 && d100<=14)) return few;
  return many;
}
// deterministyczny szum 0..1 z dwóch liczb (do "ręcznych" niedoskonałości)
function hash01(a,b){ let h = (a*374761393 + b*668265263)|0; h = (h^(h>>13))|0; h = Math.imul(h,1274126177); h ^= h>>16; return ((h>>>0)%1000)/1000; }
const rnd = (a=1,b)=> b===undefined ? Math.random()*a : a+Math.random()*(b-a);
function approach(v,target,amt){ return v<target ? Math.min(v+amt,target) : Math.max(v-amt,target); }
// mieszanie kolorów '#rrggbb' (do gradientu głębin)
function hexLerp(c1,c2,t){
  const a=parseInt(c1.slice(1),16), b=parseInt(c2.slice(1),16);
  const r=lerp((a>>16)&255,(b>>16)&255,t)|0, g=lerp((a>>8)&255,(b>>8)&255,t)|0, bl=lerp(a&255,b&255,t)|0;
  return 'rgb('+r+','+g+','+bl+')';
}

// ---------- PŁÓTNO ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const DPR = Math.min(window.devicePixelRatio||1, 2);
canvas.width = VW*DPR; canvas.height = VH*DPR;
let touchMode=false; // na dotyku: pełny ekran po pierwszym geście
let viewReady=false; // czy cała gra jest już zainicjowana (można przebudować bufory tła)
function fitCanvas(){
  const w = window.innerWidth||1, h = window.innerHeight||1;
  const landscape = w>=h;
  // szerokość logiczna dobrana tak, by proporcje płótna = proporcje okna → zero pasków
  const aspect = landscape ? w/h : h/w;
  const nw = Math.round(Math.min(VW_MAX, Math.max(VW_MIN, VH*aspect)));
  if(nw!==VW){
    VW = nw;
    canvas.width = VW*DPR; canvas.height = VH*DPR;
    if(viewReady) rebuildViewCaches();
  }
  if(landscape){
    // wypełnij okno 1:1 (proporcje się zgadzają, więc nic się nie rozciąga)
    canvas.style.width  = w+'px';
    canvas.style.height = h+'px';
  }else{
    // pion: wyśrodkowane dopasowanie (gra i tak prosi o obrót telefonu)
    const s = Math.min(w/VW, h/VH);
    canvas.style.width  = Math.round(VW*s)+'px';
    canvas.style.height = Math.round(VH*s)+'px';
  }
}
window.addEventListener('resize', fitCanvas); fitCanvas();
window.addEventListener('orientationchange', ()=>setTimeout(fitCanvas,50));
if(document.addEventListener) document.addEventListener('fullscreenchange', fitCanvas);
// pełny ekran (jak F11) — przeglądarka pozwala na to tylko w reakcji na gest gracza
function goFullscreen(){
  try{
    if(document.fullscreenElement) return;
    const el=document.documentElement;
    const rq=el.requestFullscreen||el.webkitRequestFullscreen;
    if(rq){ const pr=rq.call(el); if(pr&&pr.catch) pr.catch(()=>{}); }
    if(screen.orientation&&screen.orientation.lock){
      const lk=screen.orientation.lock('landscape'); if(lk&&lk.catch) lk.catch(()=>{});
    }
  }catch(e){}
}

// pomocnicze płótno offscreen
function makeCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }

// ---------- WEJŚCIE ----------
const Input = {
  down:{}, pressed:{},
  map:{ ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
        ArrowUp:'jump', KeyW:'jump', Space:'jump',
        ArrowDown:'down', KeyS:'down',
        Enter:'enter', Escape:'esc', KeyR:'r', KeyM:'m', KeyN:'n', KeyH:'h', KeyV:'v' },
  init(){
    window.addEventListener('keydown', e=>{
      const k=this.map[e.code]; if(!k) return;
      e.preventDefault();
      if(!this.down[k]) this.pressed[k]=true;
      this.down[k]=true;
      Audio2.unlock();
    });
    window.addEventListener('keyup', e=>{
      const k=this.map[e.code]; if(!k) return;
      this.down[k]=false;
    });
    window.addEventListener('pointerdown', ()=>Audio2.unlock());
  },
  endFrame(){ this.pressed={}; }
};
Input.init();

// ---------- AUTO-PAUZA przy zwinięciu karty/aplikacji ----------
// zapobiega utracie serca w momencie powrotu do gry po zejściu z ekranu
function autoPause(){
  if(game.state==='play' && !game.paused){
    game.paused=true;
    Audio2.suspend();
  }
}
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) autoPause(); });
window.addEventListener('blur', autoPause);
window.addEventListener('pagehide', autoPause);

// ---------- STEROWANIE DOTYKOWE (telefony/tablety) ----------
const Touch2 = {
  enabled:false,
  ptrs:{}, // pointerId -> wciśnięty klawisz
  press(k){ if(!Input.down[k]) Input.pressed[k]=true; Input.down[k]=true; },
  release(k){ Input.down[k]=false; },
  init(){
    try{ this.enabled = ('ontouchstart' in window) || (navigator.maxTouchPoints>0); }catch(e){}
    if(this.enabled){ touchMode=true; fitCanvas(); }
    const toL = e=>{ const r=canvas.getBoundingClientRect();
      return {x:(e.clientX-r.left)/r.width*VW, y:(e.clientY-r.top)/r.height*VH}; };
    const hit = pt=>{
      for(const z of touchZones()){
        if(z.kind==='circle'){ const dx=pt.x-z.x, dy=pt.y-z.y; if(dx*dx+dy*dy<=z.r*z.r) return z.key; }
        else if(pt.x>=z.x&&pt.x<=z.x+z.w&&pt.y>=z.y&&pt.y<=z.y+z.h) return z.key;
      }
      return null;
    };
    canvas.addEventListener('pointerdown', e=>{
      if(e.pointerType==='touch'){
        if(!this.enabled){ this.enabled=true; touchMode=true; fitCanvas(); }
        goFullscreen(); // wejście w pełny ekran przy każdym dotknięciu poza nim
      }
      Audio2.unlock();
      if(!this.enabled) return;
      const k=hit(toL(e));
      if(k){ this.ptrs[e.pointerId]=k; this.press(k); }
      e.preventDefault();
    });
    window.addEventListener('pointermove', e=>{
      const k=this.ptrs[e.pointerId];
      if(!k) return;
      // przesuwanie palca między ◀ i ▶ bez odrywania
      if(k==='left'||k==='right'){
        const k2=hit(toL(e));
        if((k2==='left'||k2==='right') && k2!==k){
          this.release(k); this.press(k2); this.ptrs[e.pointerId]=k2;
        }
      }
    });
    const up = e=>{
      const k=this.ptrs[e.pointerId];
      if(k){ this.release(k); delete this.ptrs[e.pointerId]; }
    };
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
    canvas.addEventListener('contextmenu', e=>e.preventDefault());
  }
};

  }else if(game.state==='gameover'){
    // podział lewo/prawo — dopasowany do napisu "ENTER — ... • M — menu" w jednej linii
    z.push({kind:'rect', x:0, y:0, w:VW*0.6, h:VH, key:'enter'});

  }else if(game.state==='intro'){

    z.push({kind:'circle', x:40, y:VH-40, r:28, key:'h'});

    z.push({kind:'rect', x:0, y:0, w:VW, h:VH, key:'enter'});
  }

// rysowanie przycisków (tylko gdy wykryto dotyk)
function drawTouchUI(){
  if(!Touch2.enabled) return;
  const P = level && level.pal ? level.pal : PALS[0];
  for(const z of touchZones()){
    if(z.kind!=='circle') continue;
    ctx.globalAlpha = Input.down[z.key] ? 0.5 : 0.26;
    ctx.fillStyle=P.ink;
    ctx.beginPath(); ctx.arc(z.x,z.y,z.r,0,6.283); ctx.fill();
    ctx.globalAlpha = Input.down[z.key] ? 0.9 : 0.5;
    ctx.strokeStyle=P.paper; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(z.x,z.y,z.r,0,6.283); ctx.stroke();
    ctx.fillStyle=P.paper; ctx.strokeStyle=P.paper;
    const s=z.r*0.42;
    ctx.save(); ctx.translate(z.x,z.y);
    if(z.key==='left'){  ctx.beginPath(); ctx.moveTo(-s,0); ctx.lineTo(s*.7,-s); ctx.lineTo(s*.7,s); ctx.closePath(); ctx.fill(); }
    if(z.key==='right'){ ctx.beginPath(); ctx.moveTo(s,0); ctx.lineTo(-s*.7,-s); ctx.lineTo(-s*.7,s); ctx.closePath(); ctx.fill(); }
    if(z.key==='jump'){  // haczyk — zarzucenie / zryw
      ctx.lineWidth=5; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(2,-s); ctx.lineTo(2,s*0.25);
      ctx.arc(-s*0.32,s*0.25,s*0.55, 0, 2.6); ctx.stroke();
      ctx.beginPath(); ctx.arc(2,-s,3.4,0,6.283); ctx.fill();
      ctx.lineCap='butt';
    }
    if(z.key==='esc'){   ctx.fillRect(-s*.7,-s,s*.5,s*2); ctx.fillRect(s*.2,-s,s*.5,s*2); }
    if(z.key==='h'){     ctx.font=`900 ${s*2.3}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('?',0,2); }
    if(z.key==='v'){     // głośnik: korpus + fala dźwięku (przekreślona gdy wyciszone)
      ctx.lineWidth=3; ctx.lineCap='round'; ctx.lineJoin='round';
      ctx.beginPath();
      ctx.moveTo(-s*0.9,-s*0.3); ctx.lineTo(-s*0.35,-s*0.3); ctx.lineTo(s*0.15,-s*0.75);
      ctx.lineTo(s*0.15,s*0.75); ctx.lineTo(-s*0.35,s*0.3); ctx.lineTo(-s*0.9,s*0.3); ctx.closePath();
      ctx.fill();
      if(Audio2.muted){
        ctx.beginPath(); ctx.moveTo(s*0.35,-s*0.55); ctx.lineTo(s*1.05,s*0.55); ctx.stroke();
      }else{
        ctx.beginPath(); ctx.arc(s*0.15,0,s*0.62,-0.7,0.7); ctx.stroke();
      }
    }
    ctx.restore();
  }
  ctx.globalAlpha=1;
}

// ---------- AUDIO (Web Audio API — efekty + muzyka chiptune) ----------
const Audio2 = {
  ctx:null, master:null, musicGain:null, noiseBuf:null, ok:false,
  muted:(function(){ try{ return localStorage.getItem('blystka_muted')==='1'; }catch(e){ return false; } })(),
  unlock(){
    if(this.ok) return;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = this.muted?0:0.5;
      this.master.connect(this.ctx.destination);
      this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = 0.32;
      this.musicGain.connect(this.master);
      // bufor białego szumu do perkusji/efektów
      const len = this.ctx.sampleRate|0;
      this.noiseBuf = this.ctx.createBuffer(1,len,this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
      this.ok = true;
      this.resume();
      Music.reset();
    }catch(e){ /* brak audio — gra działa dalej */ }
  },
  setMuted(m){
    this.muted = m;
    if(this.master) this.master.gain.value = m?0:0.5;
    try{ localStorage.setItem('blystka_muted', m?'1':'0'); }catch(e){}
  },
  suspend(){ if(this.ok && this.ctx.state==='running') this.ctx.suspend(); },
  resume(){ if(this.ok && this.ctx.state==='suspended') this.ctx.resume(); },
  // pojedynczy ton z obwiednią i glissandem
  tone(f0,f1,dur,type,vol,delay=0,dest){
    if(!this.ok) return;
    const t = this.ctx.currentTime+delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(Math.max(20,f0),t);
    if(f1 && f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vol,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(dest||this.master);
    o.start(t); o.stop(t+dur+0.05);
  },
  // rozbłysk szumu przez filtr dolnoprzepustowy
  noise(dur,vol,fc=1200,delay=0,dest){
    if(!this.ok) return;
    const t=this.ctx.currentTime+delay;
    const s=this.ctx.createBufferSource(); s.buffer=this.noiseBuf; s.loop=true;
    const f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=fc;
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vol,t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(dest||this.master);
    s.start(t); s.stop(t+dur+0.05);
  }
};

const SONG_MAIN = { // kołysząca się szanta znad atramentu
  lead:[0,null,3,null,7,null,5,null,  3,null,2,null,0,null,null,null,
        -2,null,0,null,3,null,7,null, 8,7,5,null,3,null,2,null],
  bass:[0,null,null,0,null,null,7,null,  -4,null,null,-4,null,null,-4,null,

const SONG_BOSS = { // głębia się burzy
  lead:[0,null,1,null,0,null,-2,null, 0,0,1,null,3,null,1,0,
        0,null,1,null,6,null,5,null,  3,null,1,null,0,null,-2,null],
  bass:[0,0,null,0,0,null,0,null, -4,-4,null,-4,-4,null,-4,null,
        -2,-2,null,-2,-2,null,-2,null, -5,-5,null,-5,-5,null,-4,null]
};
const Music = {
  step:0, nextT:0, cfg:{tempo:100,tr:0,song:SONG_MAIN}, on:false,
  set(cfg){ this.cfg=cfg; this.reset(); },
  reset(){ this.step=0; if(Audio2.ok) this.nextT = Audio2.ctx.currentTime+0.1; },
  update(){
    if(!Audio2.ok || !this.on || Audio2.ctx.state!=='running') return;
    const stepDur = 60/this.cfg.tempo/2; // ósemki
    while(this.nextT < Audio2.ctx.currentTime + 0.18){
      this.schedule(this.step, this.nextT, stepDur);
      this.nextT += stepDur;
      this.step = (this.step+1)%32;
    }
  },
  schedule(s,t,dur){
    const {tr,song} = this.cfg, dest = Audio2.musicGain;
    const L = song.lead[s], B = song.bass[s];
    if(L!==null && L!==undefined){
      const f = 440*Math.pow(2,(L+tr)/12);
      Audio2.tone(f,0,dur*0.9,'square',.045, t-Audio2.ctx.currentTime, dest);
    }
    if(B!==null && B!==undefined){
      const f = 110*Math.pow(2,(B+tr)/12);
      Audio2.tone(f,0,dur*1.6,'triangle',.075, t-Audio2.ctx.currentTime, dest);
    }
    if(s%2===0) Audio2.noise(.03,.014,6000, t-Audio2.ctx.currentTime, dest);
    if(s%8===4) Audio2.noise(.08,.03,1800,  t-Audio2.ctx.currentTime, dest);
  }
};

    ph:rnd(6.28), got:false});
  // serca i magnesy
  for(const f of def.hearts)  lv.heartsL.push({x:60+hash01((f*97)|0,idx)* (VW-120), y:SURF+f*def.depth, ph:rnd(6.28), got:false});
  for(const f of def.magnets) lv.magnetsL.push({x:60+hash01((f*53)|0,idx+9)*(VW-120), y:SURF+f*def.depth, ph:rnd(6.28), got:false});
  if(def.boss) lv.boss=newBoss(lv);
  return lv;
}
function newFish(sp,lv){
  const D=FISH_DEF[sp.k], depth=lv?lv.depth:level.depth;
  const dir = Math.random()<0.5?-1:1;
  const by = SURF+lerp(sp.d0,sp.d1,Math.random())*depth;
  return { k:sp.k, spec:sp, w:D.w, h:D.h, val:D.val,
    x:rnd(-60,VW+60), y:by, by,
    v:rnd(D.v0,D.v1), dir, ph:rnd(6.28), amp:D.amp, t:rnd(6.28), lunge:0 };
}

// ---------- CZĄSTECZKI I NAPISY ----------
const parts=[], floaters=[];
function spawnP(x,y,n,opts){
  for(let i=0;i<n;i++){
    if(parts.length>420) parts.shift();
    const a=opts.ang!==undefined? opts.ang+rnd(-opts.spread,opts.spread) : rnd(0,6.283);
    const sp=rnd(opts.sp0||20, opts.sp1||90);
    parts.push({x,y, vx:Math.cos(a)*sp+(opts.vx||0), vy:Math.sin(a)*sp+(opts.vy||0),
      life:rnd(opts.l0||0.25,opts.l1||0.6), t:0, size:rnd(opts.s0||2,opts.s1||4),
      col:opts.cols[(Math.random()*opts.cols.length)|0], grav:opts.grav!==undefined?opts.grav:600});
  }
}
function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.t+=dt;
    if(p.t>=p.life){ parts.splice(i,1); continue; }
    p.vy+=p.grav*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
  }
  for(let i=floaters.length-1;i>=0;i--){
    const f=floaters[i]; f.t+=dt; f.y-=28*dt;
    if(f.t>1.1) floaters.splice(i,1);
  }
}
function drawParts(g){
  for(const p of parts){
    const k=1-p.t/p.life;
    g.globalAlpha=k; g.fillStyle=p.col;
    g.fillRect(p.x-p.size*k/2, p.y-p.size*k/2, p.size*k, p.size*k);
  }
  g.globalAlpha=1;
}
function floatTxt(x,y,str,col){ floaters.push({x,y,str,col,t:0}); }
// bąbelki w wodzie
function bubblesAt(x,y,n=6){
  spawnP(x,y,n,{cols:[level.pal.paper,level.pal.top], sp0:10,sp1:50, l0:.3,l1:.8, s0:2,s1:4, grav:-160});
}
// plusk na tafli
function splashAt(x,n=14){
  spawnP(x,SURF,n,{cols:[level.pal.paper,level.pal.top,level.pal.ground], sp0:60,sp1:190,
    l0:.25,l1:.55, s0:2,s1:5, grav:620, ang:-Math.PI/2, spread:1.1});
}

// ---------- PARALAKSA GŁĘBIN (3 warstwy pionowo zapętlone co 720 px) ----------
const LAYER_H=720;
function buildLayers(lv){
  const P=lv.pal, id=lv.def.pal, layers=[];
  const mk=(f, painter)=>{ const cv=makeCanvas(VW,LAYER_H); painter(cv.getContext('2d')); layers.push({cv,f}); };
  if(id===0){ // ZATOKA PAPIERU — snopy światła i piaskowe pagórki
    mk(0.10,g=>{
      g.fillStyle=P.paper; g.globalAlpha=.10;
      for(let i=0;i<5;i++){ const bx=i*(VW/5)+hash01(i,1)*90;
        g.beginPath(); g.moveTo(bx,0); g.lineTo(bx+90,0); g.lineTo(bx+250,LAYER_H); g.lineTo(bx+140,LAYER_H); g.closePath(); g.fill(); }
      g.globalAlpha=.5; g.fillStyle=P.mid;
      for(let i=0;i<4;i++){ const by=i*190+60;
        g.beginPath(); g.ellipse(hash01(i,2)*VW, by, 130+hash01(i,3)*90, 26, 0, 0,6.283); g.fill(); }
      g.globalAlpha=1;
    });
    mk(0.30,g=>{ // faliste wodorosty z papieru
      g.strokeStyle=P.mid; g.lineWidth=4; g.globalAlpha=.8;
      for(let i=0;i<9;i++){ const bx=i*(VW/9)+hash01(i,4)*40, by=hash01(i,5)*LAYER_H;
        g.beginPath(); g.moveTo(bx,by);
        for(let k=1;k<=5;k++) g.quadraticCurveTo(bx+(k%2?14:-14), by+k*24-12, bx, by+k*24);
        g.stroke(); }
      g.globalAlpha=1;
    });
    mk(0.55,g=>{ // plankton
      g.fillStyle=P.paper;
      for(let i=0;i<34;i++){ g.globalAlpha=.15+hash01(i,6)*.3;
        g.fillRect(hash01(i,7)*VW, hash01(i,8)*LAYER_H, 2.5,2.5); }
      g.globalAlpha=1;
    });
  }else if(id===1){ // LAS WODOROSTÓW — gęste liście i świecące zarodniki
    mk(0.10,g=>{
      g.fillStyle=P.far;
      for(let i=0;i<7;i++){ const bx=i*(VW/7)+hash01(i,1)*50, by=hash01(i,2)*LAYER_H;
        for(let k=0;k<4;k++){ g.save(); g.translate(bx,by+k*150); g.rotate(-.3+hash01(i,k)*.6);
          g.beginPath(); g.moveTo(0,0); g.quadraticCurveTo(-34,-70,0,-140); g.quadraticCurveTo(34,-70,0,0); g.fill(); g.restore(); } }
    });
    mk(0.32,g=>{
      g.strokeStyle=P.mid; g.lineWidth=5;
      for(let i=0;i<8;i++){ const bx=i*(VW/8)+hash01(i,3)*60;
        g.beginPath(); g.moveTo(bx,0);
        for(let k=1;k<=8;k++) g.quadraticCurveTo(bx+(k%2?22:-22), k*90-45, bx, k*90);
        g.stroke();
        g.fillStyle=P.mid;
        for(let k=1;k<=7;k++){ g.save(); g.translate(bx,k*90+10); g.rotate(k%2?.7:-.7);
          g.beginPath(); g.ellipse(0,0,7,20,0,0,6.283); g.fill(); g.restore(); } }
    });
    mk(0.55,g=>{ // zarodniki-świetliki
      for(let i=0;i<26;i++){ g.fillStyle = hash01(i,9)<.4 ? P.accent : P.paper;
        g.globalAlpha=.2+hash01(i,4)*.6;
        g.beginPath(); g.arc(hash01(i,5)*VW, hash01(i,6)*LAYER_H, 1.6+hash01(i,7)*1.6, 0,6.283); g.fill(); }
      g.globalAlpha=1;
    });
  }else if(id===2){ // WRAK — maszty, liny, zatopione trybiki
    mk(0.10,g=>{
      g.fillStyle=P.far; g.globalAlpha=.85;
      g.beginPath(); g.moveTo(VW*.14,LAYER_H); g.quadraticCurveTo(VW*.3,LAYER_H-260, VW*.52,LAYER_H-180);
      g.lineTo(VW*.52,LAYER_H); g.closePath(); g.fill();
      g.fillRect(VW*.30,LAYER_H-560,10,560);
      g.fillRect(VW*.30-52,LAYER_H-470,114,9);
      g.fillRect(VW*.72,120,9,430);
      g.globalAlpha=.35;
      g.beginPath(); g.moveTo(VW*.30+5,LAYER_H-560); g.lineTo(VW*.30-120,LAYER_H-300); g.stroke();
      g.globalAlpha=1;
    });
    mk(0.32,g=>{
      g.strokeStyle=P.mid; g.lineWidth=3;
      for(let i=0;i<7;i++){ const bx=i*(VW/7)+30+hash01(i,1)*40, len=90+hash01(i,2)*260, by=hash01(i,3)*(LAYER_H-len);
        for(let k=0;k<len;k+=11){ g.beginPath(); g.ellipse(bx,by+k+6,3.4,6,0,0,6.283); g.stroke(); } }
      for(let i=0;i<6;i++) drawBigGear(g, hash01(i,4)*VW, hash01(i,5)*LAYER_H, 20+hash01(i,6)*22, P.mid, P.ink, .8);
    });
    mk(0.55,g=>{ // płatki rdzy
      g.fillStyle=P.rust;
      for(let i=0;i<26;i++){ g.globalAlpha=.15+hash01(i,7)*.3;
        g.save(); g.translate(hash01(i,8)*VW, hash01(i,9)*LAYER_H); g.rotate(hash01(i,10)*3);
        g.fillRect(-2,-1,4,2); g.restore(); }
      g.globalAlpha=1;
    });
  }else{ // GŁĘBIA — kolumny otchłani i wielkie ości
    mk(0.10,g=>{
      g.fillStyle=P.far;
      for(let i=0;i<4;i++){ const bx=i*(VW/4)+hash01(i,1)*70, ww=60+hash01(i,2)*70;
        g.fillRect(bx,0,ww,LAYER_H); }
      g.globalAlpha=.5; g.fillStyle=P.mid;
      g.beginPath(); g.arc(VW*.5,LAYER_H*.55,190, 3.4, 6.0); g.lineWidth=14; g.strokeStyle=P.mid; g.stroke();
      g.globalAlpha=1;
    });
    mk(0.32,g=>{ // żebra wielkiej ryby
      g.strokeStyle=P.mid; g.lineWidth=7; g.globalAlpha=.7;
      for(let i=0;i<5;i++){ const by=i*150+70;
        g.beginPath(); g.arc(VW*.62, by, 90+hash01(i,3)*40, 2.6, 3.8+hash01(i,4)); g.stroke(); }
      g.globalAlpha=1;
    });
    mk(0.55,g=>{
      g.fillStyle=P.paper;
      for(let i=0;i<20;i++){ g.globalAlpha=.08+hash01(i,5)*.2;
        g.fillRect(hash01(i,6)*VW, hash01(i,7)*LAYER_H, 2,2); }
      g.globalAlpha=1;
    });
  }
  return layers;
}
// duża zębatka (echa świata Trybki na dnie)
function drawBigGear(g,x,y,rad,fill,ink,alpha){
  g.save(); g.globalAlpha=alpha; g.translate(x,y);
  g.fillStyle=fill;
  g.beginPath(); g.arc(0,0,rad,0,6.283); g.fill();
  for(let i=0;i<8;i++){ const a=i/8*6.283;
    g.save(); g.rotate(a); g.fillRect(rad-2,-rad*0.16,rad*0.3,rad*0.32); g.restore(); }
  g.strokeStyle=ink; g.lineWidth=2; g.globalAlpha=alpha*.6;
  g.beginPath(); g.arc(0,0,rad*0.45,0,6.283); g.stroke();
  g.restore(); g.globalAlpha=1;
}
// ---------- DNO (rysowane raz na łowisko) ----------
function buildFloor(lv){
  const cv=makeCanvas(VW,90), g=cv.getContext('2d'), P=lv.pal, id=lv.def.pal;
  g.fillStyle=P.groundDark; g.fillRect(0,0,VW,90);
  // falista linia osadu
  g.fillStyle=P.mid; g.globalAlpha=.5;
  g.beginPath(); g.moveTo(0,18);
  for(let x=0;x<=VW;x+=40) g.quadraticCurveTo(x+20, 10+hash01(x,id)*14, x+40, 16+hash01(x+1,id)*8);
  g.lineTo(VW,0); g.lineTo(0,0); g.closePath(); g.fill(); g.globalAlpha=1;
  g.strokeStyle=P.ink; g.globalAlpha=.5; g.lineWidth=2;
  g.beginPath(); g.moveTo(0,14);
  for(let x=0;x<=VW;x+=40) g.quadraticCurveTo(x+20, 8+hash01(x,id)*14, x+40, 14+hash01(x+1,id)*8);
  g.stroke(); g.globalAlpha=1;
  // dekoracje dna — zatopione trybiki, kotwica, muszle, ości
  for(let i=0;i<9;i++){
    const x=30+hash01(i*7,id*3)*(VW-60), h=hash01(i,id+5);
    if(h<0.3) drawBigGear(g,x,52+h*40,10+h*26,P.mid,P.ink,.85);
    else if(h<0.5){ // muszla / kamyk
      g.fillStyle=P.paper; g.globalAlpha=.7;
      g.beginPath(); g.arc(x,58,5+h*6,3.14,6.283); g.fill(); g.globalAlpha=1;
      g.strokeStyle=P.ink; g.globalAlpha=.4; g.beginPath(); g.arc(x,58,5+h*6,3.14,6.283); g.stroke(); g.globalAlpha=1;
    }else if(h<0.68 && id>=2){ // ość
      g.strokeStyle=P.paper; g.globalAlpha=.5; g.lineWidth=2;
      g.beginPath(); g.moveTo(x-16,50); g.lineTo(x+16,46); g.stroke();
      for(let k=-1;k<=1;k++){ g.beginPath(); g.moveTo(x+k*8-2,48); g.lineTo(x+k*8+2,38); g.stroke(); }
      g.globalAlpha=1;
    }else{ g.fillStyle=P.mid; g.beginPath(); g.arc(x,60,3.4,0,6.283); g.fill(); }
  }
  if(id===2){ // wielka kotwica wraku
    g.strokeStyle=P.ink; g.lineWidth=6; g.globalAlpha=.8;
    const ax=VW*.62;
    g.beginPath(); g.moveTo(ax,8); g.lineTo(ax,58); g.stroke();
    g.beginPath(); g.arc(ax,52,20, .5, 2.64); g.stroke();
    g.beginPath(); g.moveTo(ax-14,14); g.lineTo(ax+14,14); g.stroke();
    g.beginPath(); g.arc(ax,4,5,0,6.283); g.stroke();
    g.globalAlpha=1;
  }
  return cv;
}

// ---------- RYBY, MEDUZY, MINY, BĄBLE ----------
function updateFish(f,dt){
  const D=FISH_DEF[f.k];
  f.t+=dt;
  const hook=player.hook, under = player.phase==='drop'||player.phase==='reel';
  if(f.k==='latarnica' && under){ // latarnica goni haczyk
    const dx=hook.x-f.x, dy=hook.y-f.y, d=Math.hypot(dx,dy);
    if(d<190){ f.lunge=Math.min(1,f.lunge+dt*2);
      f.x+=dx/d*130*f.lunge*dt; f.by+=dy/d*110*f.lunge*dt; f.dir=dx<0?-1:1; }
    else f.lunge=Math.max(0,f.lunge-dt);
  }
  if(f.k==='zlota' && under){ // złota iskra ucieka
    const dx=f.x-hook.x, dy=f.by-hook.y, d=Math.hypot(dx,dy);
    if(d<130 && d>1){ f.x+=dx/d*140*dt; f.by=clamp(f.by+dy/d*90*dt, SURF+70, SURF+level.depth-50); f.dir=dx<0?-1:1; }
  }
  // magnes przyciąga podczas zwijania
  if(player.pow>0 && player.phase==='reel'){
    const dx=hook.x-f.x, dy=hook.y-f.y, d=Math.hypot(dx,dy);
    if(d<150 && d>2){ f.x+=dx/d*250*dt; f.by+=dy/d*250*dt; }
  }
  f.x += f.v*f.dir*dt;
  f.y = f.by + Math.sin(f.t*(f.k==='wegorz'?5:2.2)+f.ph)*f.amp;
  if(f.x<-80) f.x=VW+70;
  if(f.x>VW+80) f.x=-70;
}
function drawFish(g,f,scale=1,rot=0){
  const P=level.pal, D=FISH_DEF[f.k];
  g.save(); g.translate(f.x, f.y!==undefined?f.y:f.by); g.rotate(rot);
  g.scale(f.dir*scale, scale);
  const w=f.w, h=f.h, flap=Math.sin((f.t||game.time)*11+f.ph)* .5;
  let body=P.paper, back=P.mid;
  if(f.k==='okon'){ body=P.accent; back=P.rust; }
  if(f.k==='wegorz'){ body=P.rust; back=P.ink; }
  if(f.k==='latarnica'){ body=P.ink; back=P.ink; }
  if(f.k==='zlota'){ body=P.accent; back=P.paper; }
  // ogon
  g.fillStyle=body;
  g.beginPath(); g.moveTo(-w*0.42,0);
  g.lineTo(-w*0.42-h*0.7, -h*0.55+flap*3); g.lineTo(-w*0.42-h*0.7, h*0.55+flap*3);
  g.closePath(); g.fill();
  // korpus
  g.beginPath(); g.ellipse(0,0,w*0.5,h*0.5,0,0,6.283); g.fill();
  // grzbiet
  g.fillStyle=back; g.globalAlpha=.55;
  g.beginPath(); g.ellipse(0,-h*0.14,w*0.44,h*0.3,0,3.4,6.02); g.fill(); g.globalAlpha=1;
  if(f.k==='okon'){ // pręgi
    g.fillStyle=P.ink; g.globalAlpha=.35;
    for(let i=-1;i<=1;i++) g.fillRect(i*w*0.16-1.5,-h*0.4,3,h*0.8);
    g.globalAlpha=1;
  }
  if(f.k==='latarnica'){ // świecąca przynęta na czułku
    g.strokeStyle=P.paper; g.lineWidth=1.6; g.globalAlpha=.8;
    g.beginPath(); g.moveTo(w*0.3,-h*0.4); g.quadraticCurveTo(w*0.55,-h*1.1, w*0.75,-h*0.7); g.stroke(); g.globalAlpha=1;
    g.fillStyle=P.accent;
    g.globalAlpha=.25; g.beginPath(); g.arc(w*0.75,-h*0.7,8,0,6.283); g.fill(); g.globalAlpha=1;
    g.beginPath(); g.arc(w*0.75,-h*0.7,3.2,0,6.283); g.fill();
    g.fillStyle=P.paper; // zęby
    g.beginPath(); g.moveTo(w*0.5,0); g.lineTo(w*0.36,h*0.16); g.lineTo(w*0.26,0); g.closePath(); g.fill();
  }
  if(f.k==='zlota'){ // iskra
    g.fillStyle=P.paper; g.globalAlpha=.7+Math.sin(game.time*9+f.ph)*.3;
    g.beginPath(); g.arc(0,-h*0.1,2,0,6.283); g.fill(); g.globalAlpha=1;
  }
  // kontur atramentem i oko
  g.strokeStyle=P.ink; g.globalAlpha=.6; g.lineWidth=1.6;
  g.beginPath(); g.ellipse(0,0,w*0.5,h*0.5,0,0,6.283); g.stroke(); g.globalAlpha=1;
  g.fillStyle= f.k==='latarnica'?P.accent:P.ink;
  g.beginPath(); g.arc(w*0.28,-h*0.12,1.8,0,6.283); g.fill();
  g.restore();
}
function updateJelly(j,dt){
  j.ph+=dt;
  j.y-=13*dt;
  j.x+=Math.sin(j.ph*1.3)*16*dt;
  if(j.y<j.y0) j.y=j.y1;
  if(j.x<16) j.x=16; if(j.x>VW-16) j.x=VW-16;
}
function drawJelly(g,j){
  const P=level.pal, pul=1+Math.sin(j.ph*2.6)*0.12;

  g.beginPath(); g.arc(0,0,14*pul,3.14,6.283); g.quadraticCurveTo(0,7*pul,-14*pul,0); g.fill();
  g.globalAlpha=1;
  g.strokeStyle=P.ink; g.globalAlpha=.5; g.lineWidth=1.6;
  g.beginPath(); g.arc(0,0,14*pul,3.14,6.283); g.stroke(); g.globalAlpha=1;
  g.strokeStyle=P.accent; g.lineWidth=2; g.globalAlpha=.8;
  for(let i=-1;i<=1;i++){
    g.beginPath(); g.moveTo(i*7,3);
    g.quadraticCurveTo(i*7+Math.sin(j.ph*3+i)*5, 14, i*7+Math.sin(j.ph*2+i)*8, 24);
    g.stroke();
  }
  g.globalAlpha=1;
  g.fillStyle=P.ink;
  g.beginPath(); g.arc(-4,-4,1.4,0,6.283); g.fill();
  g.beginPath(); g.arc(4,-4,1.4,0,6.283); g.fill();

}
function drawMine(g,m){
  const P=level.pal, bob=Math.sin(game.time*1.4+m.ph)*4;
  g.save(); g.translate(m.x, m.y+bob);
  g.strokeStyle=P.ink; g.lineWidth=2; g.globalAlpha=.5;
  g.beginPath(); g.moveTo(0,14); g.lineTo(0,34); g.stroke(); g.globalAlpha=1; // łańcuszek w dół
  g.fillStyle=P.rust;
  g.beginPath(); g.arc(0,0,13,0,6.283); g.fill();
  g.fillStyle=P.ink;
  for(let i=0;i<8;i++){ const a=i/8*6.283+m.ph;
    g.save(); g.rotate(a); g.fillRect(11,-2,7,4); g.restore(); }
  g.strokeStyle=P.ink; g.globalAlpha=.6;
  g.beginPath(); g.arc(0,0,13,0,6.283); g.stroke(); g.globalAlpha=1;
  const blink=Math.sin(game.time*6+m.ph)>0.3;
  g.fillStyle= blink?P.accent:P.groundDark;
  g.beginPath(); g.arc(0,0,3.6,0,6.283); g.fill();
  g.restore();
}
function updateBubbles(dt){
  for(let i=level.bubbles.length-1;i>=0;i--){
    const b=level.bubbles[i];
    b.y+=b.vy*dt; b.x+=Math.sin(game.time*3+b.ph)*22*dt;
    if(b.y<SURF+8){ splashAt(b.x,6); level.bubbles.splice(i,1); continue; }
    // trafienie w haczyk
    if((player.phase==='drop'||player.phase==='reel') && player.inv<=0){
      const dx=b.x-player.hook.x, dy=b.y-player.hook.y;
      if(dx*dx+dy*dy < (b.r+HOOK_R)*(b.r+HOOK_R)){
        level.bubbles.splice(i,1); hurtPlayer('zap'); continue;
      }
    }
  }
}
function drawBubble(g,b){
  const P=level.pal;
  g.save(); g.translate(b.x,b.y);
  g.fillStyle=P.rust; g.globalAlpha=.3;
  g.beginPath(); g.arc(0,0,b.r,0,6.283); g.fill(); g.globalAlpha=1;
  g.strokeStyle=P.ink; g.lineWidth=2; g.globalAlpha=.7;
  g.beginPath(); g.arc(0,0,b.r,0,6.283); g.stroke(); g.globalAlpha=1;
  g.strokeStyle=P.paper; g.globalAlpha=.7;
  g.beginPath(); g.arc(0,0,b.r*0.6, 3.6, 4.6); g.stroke(); g.globalAlpha=1;
  g.restore();
}

// ---------- BŁYSTKA: ŁÓDKA I HACZYK ----------
function newPlayer(bx){
  return {
    x:bx, vx:0, face:1,                    // łódka na tafli
    hook:{x:bx, y:SURF-34, vx:0, vy:0},    // haczyk z błystką
    phase:'boat',                          // boat | drop | reel
    hooked:[],                             // ryby wiszące na haczyku
    pow:0, inv:0, dashT:0, dashCd:0, dashDir:1,
    tickT:0, blinkT:rnd(2,4), idleT:0, rodBend:0, splashed:false
  };
}
function rodTip(){ // czubek wędki (współrzędne świata)
  const p=player;
  return {x:p.x+p.face*24, y:SURF-36+Math.sin(game.time*1.6)*2.4 + p.rodBend};
}
function updatePlayer(dt){
  const p=player, h=p.hook;
  p.inv=Math.max(0,p.inv-dt);
  p.pow=Math.max(0,p.pow-dt);
  p.dashCd=Math.max(0,p.dashCd-dt);
  p.blinkT-=dt; if(p.blinkT<-0.13) p.blinkT=rnd(2.4,4.5);
  const ax=(Input.down.right?1:0)-(Input.down.left?1:0);

  if(p.phase==='boat'){
    p.idleT+=dt;
    if(ax!==0){ p.vx=approach(p.vx, ax*BOAT_V, BOAT_ACC*dt); p.face=ax; }
    else p.vx=approach(p.vx,0,BOAT_ACC*dt);
    p.x=clamp(p.x+p.vx*dt, 70, VW-70);
    if(Math.abs(p.vx)>60 && Math.random()<0.25)
      spawnP(p.x-p.face*26, SURF+2, 1, {cols:[level.pal.top], sp0:5,sp1:20, l0:.3,l1:.6, s0:2,s1:3, grav:-10});
    h.x=rodTip().x; h.y=rodTip().y; h.vx=0; h.vy=0;
    p.rodBend=approach(p.rodBend,0,30*dt);
    // zarzucenie
    if(Input.pressed.jump){
      p.phase='drop'; h.x=rodTip().x; h.y=rodTip().y;
      h.vx=p.face*90+p.vx*0.5; h.vy=130; p.splashed=false;
      SFX.cast();
    }
  }
  else if(p.phase==='drop'){
    // zryw — błyskawiczny unik (od 2. łowiska)
    if(game.abil.dash && Input.pressed.jump && p.dashCd<=0){
      p.dashT=DASH_T; p.dashCd=DASH_CD; p.dashDir= ax!==0?ax:(h.vx<0?-1:1);
      p.inv=Math.max(p.inv,0.22); SFX.dash(); bubblesAt(h.x,h.y,8);
    }
    if(p.dashT>0){ p.dashT-=dt; h.vx=p.dashDir*DASH_V; h.vy=approach(h.vy,0,900*dt); }
    else{
      if(ax!==0) h.vx=approach(h.vx, ax*STEER_MAX, STEER_ACC*dt);
      else h.vx=approach(h.vx,0,STEER_DRAG*dt);
      const tgt=Input.down.down?SINK_FAST:SINK;
      h.vy=approach(h.vy, tgt, SINK_ACC*dt);
    }
    h.x=clamp(h.x+h.vx*dt, 12, VW-12);
    h.y+=h.vy*dt;
    if(!p.splashed && h.y>SURF){ p.splashed=true; splashAt(h.x); SFX.splash(); }
    if(Math.random()<0.12) bubblesAt(h.x,h.y-4,1);
    // dno — koniec żyłki
    if(h.y>SURF+level.depth-20){
      h.y=SURF+level.depth-20;
      spawnP(h.x,h.y+8,10,{cols:[level.pal.mid,level.pal.groundDark], sp0:20,sp1:70, l0:.3,l1:.7, s0:2,s1:5, grav:-30, ang:-Math.PI/2, spread:1.6});
      startReel();
    }
    collideHook(true);
  }
  else if(p.phase==='reel'){
    if(game.abil.dash && Input.pressed.jump && p.dashCd<=0){
      p.dashT=DASH_T; p.dashCd=DASH_CD; p.dashDir= ax!==0?ax:1;
      p.inv=Math.max(p.inv,0.22); SFX.dash(); bubblesAt(h.x,h.y,8);
    }
    if(p.dashT>0){ p.dashT-=dt; h.vx=p.dashDir*DASH_V; }
    else{
      if(ax!==0) h.vx=approach(h.vx, ax*STEER_MAX, STEER_ACC*dt);
      else h.vx=approach(h.vx,0,STEER_DRAG*dt);
    }
    h.vy=approach(h.vy, -REEL_V, REEL_ACC*dt);
    h.x=clamp(h.x+h.vx*dt, 12, VW-12);
    h.y+=h.vy*dt;
    // łódka podpływa nad haczyk
    p.x=clamp(approach(p.x, h.x, 120*dt), 70, VW-70);
    p.face = h.x<p.x-4?-1: h.x>p.x+4?1: p.face;
    p.rodBend=approach(p.rodBend, 7, 40*dt);
    // terkot kołowrotka
    p.tickT+=dt; if(p.tickT>0.11){ p.tickT=0; SFX.tick(); }
    if(Math.random()<0.2) bubblesAt(h.x,h.y+6,1);
    collideHook(false);
    // powierzchnia — podliczenie połowu
    if(h.y<SURF-6){ splashAt(h.x); SFX.splash(); tallyCatch(); }
  }
}
function startReel(){ if(player.phase==='drop'){ player.phase='reel'; player.hook.vy=Math.min(player.hook.vy,-80); } }
// kolizje haczyka: ryby, meduzy, miny
function collideHook(descending){
  const p=player, h=p.hook;
  for(let i=level.fishes.length-1;i>=0;i--){
    const f=level.fishes[i];
    if(Math.abs(f.x-h.x)<f.w/2+HOOK_R && Math.abs(f.y-h.y)<f.h/2+HOOK_R){
      level.fishes.splice(i,1);
      level.respawnQ.push({spec:f.spec, t:rnd(2.5,5.5)});
      p.hooked.push(f);
      floatTxt(h.x,h.y-14,'+'+f.val, level.pal.accent);
      if(descending){ SFX.hook(); startReel(); }
      else SFX.collect();
      bubblesAt(h.x,h.y,5);
    }
  }
  if(p.inv>0) return;
  for(const j of level.jellies){
    const dx=j.x-h.x, dy=j.y-h.y;
    if(dx*dx+dy*dy < (j.r+HOOK_R)*(j.r+HOOK_R)){ hurtPlayer('zap'); return; }
  }
  for(const m of level.mines){
    if(m.gone) continue;
    const my=m.y+Math.sin(game.time*1.4+m.ph)*4;
    const dx=m.x-h.x, dy=my-h.y;
    if(dx*dx+dy*dy < (16+HOOK_R)*(16+HOOK_R)){
      m.gone=true;
      spawnP(m.x,my,26,{cols:[level.pal.rust,level.pal.accent,level.pal.ink], sp0:60,sp1:230, l0:.3,l1:.7, s0:3,s1:6, grav:-60});
      shake(0.4,8); SFX.boom();
      hurtPlayer('boom'); return;
    }
  }
}
function hurtPlayer(src){
  const p=player;
  if(p.inv>0 || game.state!=='play') return;
  game.hearts--; p.inv=1.5;
  shake(0.3,6);
  if(src==='zap') SFX.zap(); else if(src!=='boom') SFX.hurt();
  // część ryb ucieka z haczyka
  const dropN=Math.min(2,p.hooked.length);
  for(let i=0;i<dropN;i++){
    const f=p.hooked.pop();
    level.respawnQ.push({spec:f.spec, t:rnd(1,2)});
  }
  if(dropN===1) floatTxt(p.hook.x,p.hook.y-10,'uciekła!', level.pal.rust);
  else if(dropN>1) {
    const verb = plForm(dropN, 'uciekła', 'uciekły', 'uciekło');
    floatTxt(p.hook.x,p.hook.y-10, dropN+' '+plForm(dropN,'ryba','ryby','ryb')+' '+verb+'!', level.pal.rust);
  }
  bubblesAt(p.hook.x,p.hook.y,10);
  if(game.hearts<=0){
    game.state='gameover'; game.timer=0;
    saveBest(); Music.on=false; SFX.explode();
  }else if(p.phase==='drop') startReel();
}
// podliczenie połowu na powierzchni
function tallyCatch(){
  const p=player, n=p.hooked.length;
  if(n>0){
    let sum=0; for(const f of p.hooked) sum+=f.val;
    const total=Math.round(sum*(1+0.05*Math.max(0,n-1)));
    game.score+=total;
    floatTxt(p.x, SURF-56, '+'+total, level.pal.accent);
    if(n>1) floatTxt(p.x, SURF-32, n+' '+plForm(n,'ryba','ryby','ryb')+'!', level.pal.paper);
    if(n>=4) SFX.clear(); else SFX.tally();
    spawnP(p.x,SURF-10,n*4,{cols:[level.pal.paper,level.pal.accent], sp0:40,sp1:140, l0:.3,l1:.7, s0:2,s1:4, grav:500, ang:-Math.PI/2, spread:1});
  }
  p.hooked=[];
  p.phase='boat'; p.rodBend=0;
  // cel łowiska osiągnięty?
  if(!level.isBoss && game.score-game.scoreAtStart>=level.def.target) startClear();
}

// ---------- PERŁY, SERCA, MAGNESY ----------
function updatePickups(dt){
  const h=player.hook, under=player.phase==='drop'||player.phase==='reel';
  for(const pe of level.pearlsL){
    if(pe.got) continue;
    if(player.pow>0 && under){
      const dx=h.x-pe.x, dy=h.y-pe.y, d=Math.hypot(dx,dy);
      if(d<110 && d>2){ pe.x+=dx/d*260*dt; pe.y+=dy/d*260*dt; }
    }
    if(under && Math.abs(pe.x-h.x)<16 && Math.abs(pe.y-h.y)<16){
      pe.got=true; game.pearls++; game.score+=15;
      floatTxt(pe.x,pe.y-12,'+15',level.pal.paper); SFX.pearl();
      spawnP(pe.x,pe.y,7,{cols:[level.pal.paper,level.pal.accent], sp0:20,sp1:80, l0:.2,l1:.5, s0:2,s1:3, grav:-60});
    }
  }
  for(const he of level.heartsL){
    if(he.got) continue;
    if(under && Math.abs(he.x-h.x)<18 && Math.abs(he.y-h.y)<18 && game.hearts<3){
      he.got=true; game.hearts++;
      floatTxt(he.x,he.y-12,'serce!','#c9574a'); SFX.heart();
    }
  }
  for(const mg of level.magnetsL){
    if(mg.got) continue;
    if(under && Math.abs(mg.x-h.x)<18 && Math.abs(mg.y-h.y)<18){
      mg.got=true; player.pow=12;
      floatTxt(mg.x,mg.y-12,'MAGNES!',level.pal.accent); SFX.power();
    }
  }
  // odradzanie ryb (wpływają z boków)
  for(let i=level.respawnQ.length-1;i>=0;i--){
    const r=level.respawnQ[i]; r.t-=dt;
    if(r.t<=0){
      level.respawnQ.splice(i,1);
      const f=newFish(r.spec,level);
      f.x=Math.random()<0.5?-60:VW+60; f.dir=f.x<0?1:-1;
      level.fishes.push(f);
    }
  }
}
function drawPickups(g){
  const P=level.pal;
  for(const pe of level.pearlsL){ if(pe.got) continue;
    drawPearlIcon(g,pe.x,pe.y+Math.sin(game.time*2+pe.ph)*3,1,pe.ph);
  }
  for(const he of level.heartsL){ if(he.got) continue;
    const bob=Math.sin(game.time*2.4+he.ph)*4;
    g.strokeStyle=P.paper; g.globalAlpha=.5;
    g.beginPath(); g.arc(he.x,he.y+bob,13,0,6.283); g.stroke(); g.globalAlpha=1;
    drawHeartIcon(g,he.x,he.y+bob,1.2,true);
  }
  for(const mg of level.magnetsL){ if(mg.got) continue;
    const bob=Math.sin(game.time*2.2+mg.ph)*4;
    g.globalAlpha=.2; g.fillStyle=P.accent;
    g.beginPath(); g.arc(mg.x,mg.y+bob,16,0,6.283); g.fill(); g.globalAlpha=1;
    drawMagnetIcon(g,mg.x,mg.y+bob,1,P);
  }
}

// ---------- BOSS: SUMOR, STRAŻNIK GŁĘBIN ----------
function newBoss(lv){
  return { x:VW*0.5, y:SURF+lv.depth*0.55, dir:1, hp:5, maxHp:5,
    t:0, cyc:rnd(1.5), spitT:2.4, rage:0, state:'swim', deadT:0, active:false, gone:false };
}
function whiskerPos(b){
  return { x:b.x+b.dir*152, y:b.y-6+Math.sin(b.t*3)*10 };
}
function bossVuln(b){ return b.state==='swim' && (b.cyc%4.2)<1.7; }
function updateBoss(dt){
  const b=level.boss; if(!b||!b.active||b.gone) return;
  b.t+=dt;
  if(b.state==='dying'){
    b.deadT+=dt; b.y+=26*dt; b.dir= Math.sin(b.t*9)>0?1:-1;
    if(Math.random()<0.35) spawnP(b.x+rnd(-120,120), b.y+rnd(-40,40), 4,
      {cols:[level.pal.rust,level.pal.accent,level.pal.paper], sp0:30,sp1:160, l0:.3,l1:.8, s0:3,s1:6, grav:-60});
    if(b.deadT>2.4){ b.gone=true; startClear(); }
    return;
  }
  b.cyc+=dt;
  b.rage=Math.max(0,b.rage-dt);
  const speed=(70+(b.maxHp-b.hp)*18)*(b.rage>0?2.3:1);
  b.x+=b.dir*speed*dt;
  if(b.x<170){ b.x=170; b.dir=1; }
  if(b.x>VW-170){ b.x=VW-170; b.dir=-1; }
  b.y=SURF+level.depth*0.55+Math.sin(b.t*0.5)*140;
  // plucie bąblami rdzy
  b.spitT-=dt;
  if(b.spitT<=0){
    b.spitT= b.hp<=2?1.7:2.6;
    for(let i=0;i<3;i++) level.bubbles.push({x:b.x+b.dir*130+rnd(-10,10), y:b.y+6, vy:-rnd(95,150), r:10, ph:rnd(6.28)});
    SFX.splash();
  }
  // kolizje z haczykiem
  const p=player, h=p.hook;
  if(p.phase==='drop'||p.phase==='reel'){
    const w=whiskerPos(b), dx=w.x-h.x, dy=w.y-h.y;
    if(bossVuln(b) && dx*dx+dy*dy<24*24){
      b.hp--; b.rage=1.3; b.cyc=2.0; // wąs się chowa
      shake(0.35,7); SFX.bossHit(); SFX.roar();
      floatTxt(w.x,w.y-20,'TRAFIONY!',level.pal.accent);
      spawnP(w.x,w.y,16,{cols:[level.pal.accent,level.pal.paper], sp0:60,sp1:200, l0:.3,l1:.6, s0:3,s1:5, grav:-40});
      p.phase='reel'; h.vy=-380; p.inv=Math.max(p.inv,0.8);
      if(b.hp<=0){ b.state='dying'; b.deadT=0; Music.on=false; SFX.explode(); }
      return;
    }
    if(p.inv<=0 && Math.abs(b.x-h.x)<130 && Math.abs(b.y-h.y)<42){
      hurtPlayer('hurt'); h.vy=-300;
    }
  }
  // ratunkowe serce w bańce co jakiś czas
  level.heartT-=dt;
  if(level.heartT<=0 && game.hearts<3){
    level.heartT=22;
    level.heartsL.push({x:rnd(80,VW-80), y:SURF+level.depth-90, ph:rnd(6.28), got:false});
  }
}
function drawBoss(g){
  const b=level.boss; if(!b||!b.active||b.gone) return;
  const P=level.pal;
  const ga= b.state==='dying'? 0.55+Math.sin(b.t*20)*0.35 : 1;
  g.save(); g.translate(b.x,b.y); g.scale(b.dir,1); g.globalAlpha=ga;
  const wag=Math.sin(b.t*4)*0.5;
  // ogon
  g.fillStyle=P.ink;
  g.beginPath(); g.moveTo(-118,0);
  g.quadraticCurveTo(-168,-14+wag*22,-204,-36+wag*28);
  g.quadraticCurveTo(-174,wag*10,-204,36+wag*28);
  g.quadraticCurveTo(-168,14+wag*22,-118,0);
  g.fill();
  // cielsko
  g.beginPath(); g.ellipse(0,0,140,46,0,0,6.283); g.fill();
  // brzuch
  g.fillStyle=P.rust; g.globalAlpha=ga*.45;
  g.beginPath(); g.ellipse(8,16,108,26,0,0,3.14); g.fill();
  g.globalAlpha=ga;
  // płetwa grzbietowa
  g.fillStyle=P.ink;
  g.beginPath(); g.moveTo(-30,-40); g.quadraticCurveTo(2,-88,46,-42); g.closePath(); g.fill();
  // kontur kreską
  g.strokeStyle=P.groundDark; g.lineWidth=3; g.globalAlpha=ga*.8;
  g.beginPath(); g.ellipse(0,0,140,46,0,0,6.283); g.stroke();
  g.globalAlpha=ga;
  // oko
  const angry=b.rage>0;
  g.fillStyle=P.paper;
  g.beginPath(); g.arc(86,-16,10,0,6.283); g.fill();
  g.fillStyle= angry?'#c9574a':P.ink;
  g.beginPath(); g.arc(89,-15,4.5,0,6.283); g.fill();
  if(angry){ g.strokeStyle=P.paper; g.lineWidth=3;
    g.beginPath(); g.moveTo(72,-32); g.lineTo(100,-24); g.stroke(); }
  // pysk i górny wąs
  g.strokeStyle=P.groundDark; g.lineWidth=3;
  g.beginPath(); g.moveTo(140,8); g.quadraticCurveTo(118,16,94,12); g.stroke();
  g.strokeStyle=P.ink; g.lineWidth=4; g.lineCap='round';
  g.beginPath(); g.moveTo(130,-10); g.quadraticCurveTo(168,-30,188,-52+Math.sin(b.t*2.6)*8); g.stroke();
  g.lineCap='butt';
  g.restore();
  // dolny, świecący wąs — słaby punkt (we współrzędnych świata, zgodnie z kolizją)
  const w=whiskerPos(b), open=bossVuln(b);
  g.save(); g.globalAlpha=ga;
  g.strokeStyle= open?P.accent:P.mid; g.lineWidth=4; g.lineCap='round';
  g.beginPath(); g.moveTo(b.x+b.dir*126, b.y+4);
  g.quadraticCurveTo(b.x+b.dir*150, b.y+14, w.x, w.y); g.stroke(); g.lineCap='butt';
  if(open){
    const pul=1+Math.sin(game.time*8)*0.25;
    g.fillStyle=P.accent;
    g.globalAlpha=ga*.25; g.beginPath(); g.arc(w.x,w.y,20*pul,0,6.283); g.fill();
    g.globalAlpha=ga; g.beginPath(); g.arc(w.x,w.y,6.5,0,6.283); g.fill();
    g.fillStyle=P.paper; g.beginPath(); g.arc(w.x-2,w.y-2,2,0,6.283); g.fill();
  }else{
    g.fillStyle=P.mid; g.beginPath(); g.arc(w.x,w.y,4.5,0,6.283); g.fill();
  }
  g.restore();
  g.globalAlpha=1;
}

// ---------- KAMERA ----------
const cam={x:0,y:0};
function updateCam(dt){
  const p=player;
  const under=p.phase==='drop'||p.phase==='reel';
  const ty= under? clamp(p.hook.y-VH*0.48, 0, SURF+level.depth+80-VH) : 0;
  const k=1-Math.exp(-8*dt);
  cam.y=lerp(cam.y,ty,k); cam.x=0;
}

// ---------- PRZEPŁYW GRY ----------
const title={jump:null, jumpT:3};
function loadLevel(idx){
  game.levelIdx=idx;
  level=initLevel(idx);
  document.body.style.backgroundColor = level.pal.sky;
  level.layers=buildLayers(level);
  level.floor=buildFloor(level);
  // plankton dryfujący w toni
  level.motes=[];
  for(let i=0;i<26;i++) level.motes.push({
    x:rnd(0,VW), y:rnd(SURF+40, SURF+level.depth), ph:rnd(0,6.28), sp:rnd(6,20)*(i%2?1:-1) });
  player=newPlayer(VW*0.5);
  game.hearts=3;
  game.scoreAtStart=game.score; game.pearlsAtStart=game.pearls;
  saveProgress();
  game.abil.dash = idx>=1;
  cam.x=0; cam.y=0;
  parts.length=0; floaters.length=0;
  game.state='intro'; game.timer=0; game.fade=1; game.paused=false;
  Music.set(LEVELS[idx].music); Music.on=true; Audio2.resume();
}
function startClear(){
  game.state='clear'; game.timer=0; game.score+=200;
  floatTxt(player.x, SURF-70, '+200', level.pal.accent);
  Music.on=false; SFX.clear();
}
function toTitle(){
  game.state='title'; game.paused=false;
  game.saveData=loadProgress();
  game.score=0; game.pearls=0; game.hearts=3;
  level={pal:PALS[0], def:{pal:0}, isBoss:false}; // minimalna scena tytułowa
  document.body.style.backgroundColor = level.pal.sky;
  player=newPlayer(VW*0.62); player.face=-1;
  title.jump=null; title.jumpT=rnd(2,4);
  Music.set({tempo:76,tr:-5,song:SONG_MAIN}); Music.on=true; Audio2.resume();
}
function retryLevel(){
  game.score=game.scoreAtStart; game.pearls=game.pearlsAtStart;
  loadLevel(game.levelIdx);
}

// ---------- GŁÓWNY UPDATE ----------
function update(dt){
  game.time+=dt;
  if(Input.pressed.v) Audio2.setMuted(!Audio2.muted); // V — wycisz/włącz dźwięk (działa wszędzie)
  game.shakeT=Math.max(0,game.shakeT-dt);
  game.fade=Math.max(0,game.fade-dt*1.8);
  Music.update();
  switch(game.state){
    case 'title':
      player.idleT+=dt;
      player.blinkT-=dt; if(player.blinkT<-0.13) player.blinkT=rnd(2.4,4.5);
      // skacząca rybka w tle
      title.jumpT-=dt;
      if(title.jumpT<=0 && !title.jump) title.jump={t:0, x:rnd(VW*0.10,VW*0.42), dir:Math.random()<0.5?-1:1};
      if(title.jump){ title.jump.t+=dt;
        if(title.jump.t>1){ title.jump=null; title.jumpT=rnd(3,6); SFX.splash(); } }
      updateParts(dt);
      if(Input.pressed.enter){
        if(game.saveData){ // kontynuacja zapisanej wyprawy
          game.score=game.saveData.score||0; game.pearls=game.saveData.pearls||0;
          loadLevel(game.saveData.lvl);
        }else{ game.score=0; game.pearls=0; loadLevel(0); }
      }
      if(Input.pressed.n){ clearProgress(); game.saveData=null; game.score=0; game.pearls=0; loadLevel(0); }
      if(Input.pressed.h){ game.helpFrom='title'; game.state='help'; }
      break;
    case 'help':
      updateParts(dt);
      if(Input.pressed.esc || Input.pressed.enter || Input.pressed.h){
        if(game.helpFrom==='intro'){ game.state='intro'; }
        else if(game.helpFrom==='pause'){ game.state='play'; game.paused=true; }
        else game.state='title';
      }
      break;
    case 'intro':
      game.timer+=dt;
      updateParts(dt);
      if(Input.pressed.h){ game.helpFrom='intro'; game.state='help'; break; }
      if(game.timer>2.4 || (game.timer>0.6 && (Input.pressed.jump||Input.pressed.enter))){
        game.state='play';
        if(level.boss) level.boss.active=true;
      }
      break;
    case 'play': {
      if(Input.pressed.esc){
        game.paused=!game.paused;
        if(game.paused) Audio2.suspend(); else Audio2.resume();
      }
      if(game.paused){
        if(Input.pressed.r){ Audio2.resume(); retryLevel(); }
        if(Input.pressed.m){ Audio2.resume(); toTitle(); }
        if(Input.pressed.h){ game.helpFrom='pause'; game.state='help'; }
        break;
      }
      updatePlayer(dt);
      for(const f of level.fishes) updateFish(f,dt);
      for(const j of level.jellies) updateJelly(j,dt);
      updateBubbles(dt);
      updatePickups(dt);
      updateBoss(dt);
      updateParts(dt);
      updateCam(dt);
      // plankton dryfuje
      for(const m of level.motes){
        m.x+=m.sp*dt; m.y-=6*dt;
        if(m.x>VW) m.x-=VW; if(m.x<0) m.x+=VW;
        if(m.y<SURF+20) m.y=SURF+level.depth;
      }
      break;
    }
    case 'clear': {
      game.timer+=dt;
      player.idleT+=dt;
      for(const f of level.fishes) updateFish(f,dt);
      updateParts(dt); updateCam(dt);
      if(game.timer>2.0){
        if(game.levelIdx+1<LEVELS.length) loadLevel(game.levelIdx+1);
        else { game.state='victory'; game.timer=0; saveBest(); clearProgress(); SFX.win(); }
      }
      break;
    }
    case 'gameover':
      game.timer+=dt;
      updateParts(dt);
      if(Input.pressed.enter) retryLevel();
      if(Input.pressed.m) toTitle();
      break;
    case 'victory':
      game.timer+=dt;
      updateParts(dt);
      // wznoszące się bąbelki-konfetti
      if(Math.random()<0.35) parts.push({x:rnd(0,VW), y:cam.y+VH+10,
        vx:rnd(-20,20), vy:-rnd(40,110), life:rnd(2,4), t:0, size:rnd(3,6),
        col:[PALS[0].top,PALS[0].accent,PALS[0].paper,'#ffffff'][(Math.random()*4)|0], grav:-12});
      if(Input.pressed.enter||Input.pressed.m) toTitle();
      break;
  }
}

// ---------- TEKST (ręczny charakter — litery lekko przekrzywione) ----------
const FONT='\'Architects Daughter\',"Segoe Print","Comic Sans MS",cursive';
function txt(g,str,x,y,size,col,align='center'){
  g.font=`700 ${size}px ${FONT}`;
  g.textAlign=align; g.textBaseline='middle';
  g.lineJoin='round'; g.lineWidth=Math.max(2,size*0.16);
  g.strokeStyle='rgba(8,10,8,0.5)'; g.strokeText(str,x,y);
  g.fillStyle=col; g.fillText(str,x,y);
}
function wobTxt(g,str,x,y,size,col,shadow){
  g.font=`700 ${size}px ${FONT}`;
  g.textAlign='center'; g.textBaseline='middle';
  const cw=size*0.66;
  const x0=x-(str.length-1)*cw/2;
  for(let i=0;i<str.length;i++){
    const j=hash01(i*31,str.length*7);
    g.save();
    g.translate(x0+i*cw, y+(j-0.5)*size*0.12+Math.sin(game.time*1.7+i)*size*0.02);
    g.rotate((j-0.5)*0.12);
    if(shadow){ g.fillStyle=shadow; g.fillText(str[i],size*0.045,size*0.06); }
    g.fillStyle=col; g.fillText(str[i],0,0);
    g.restore();
  }
}
// zaokrąglony prostokąt (ścieżka)
function rrPath(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y); g.lineTo(x+w-r,y); g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r); g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  g.lineTo(x+r,y+h); g.quadraticCurveTo(x,y+h,x,y+h-r);
  g.lineTo(x,y+r); g.quadraticCurveTo(x,y,x+r,y);
  g.closePath();
}

// ---------- RENDER ----------
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const P = level && level.pal ? level.pal : PALS[0];
  ctx.fillStyle=P.sky; ctx.fillRect(0,0,VW,VH);
  const showTitleBg = game.state==='title' || (game.state==='help' && game.helpFrom==='title');
  if(showTitleBg) renderTitle();
  else renderWorld();
  if(game.state==='help') drawHelp();
  // ziarno filmowe + winieta
  ctx.globalAlpha=0.07;
  ctx.drawImage(grainCVs[((game.time*9)|0)%3], 0,0, VW,VH);
  ctx.globalAlpha=1;
  ctx.drawImage(vignette,0,0);
  if(game.fade>0){ ctx.fillStyle=P.ink; ctx.globalAlpha=Math.min(1,game.fade); ctx.fillRect(0,0,VW,VH); ctx.globalAlpha=1; }
  drawTouchUI();
}

function renderWorld(){
  const P=level.pal;
  // wstrząs kamery
  let shx=0, shy=0;
  if(game.shakeT>0){ const k=game.shakePow*game.shakeT/game.shakeDur;
    shx=rnd(-k,k); shy=rnd(-k,k); }
  const wy = SURF - cam.y + shy; // linia wody na ekranie
  if(wy > -60) drawSky(shx,wy);
  // toń — gradient głębi + paralaksa
  if(wy < VH){
    const gy0=Math.max(0,wy), gy1=VH;
    const fr=(sy)=>clamp((sy+cam.y-SURF)/level.depth,0,1);
    const gr=ctx.createLinearGradient(0,gy0,0,gy1);
    gr.addColorStop(0, hexLerp(P.ground,P.groundDark, fr(gy0)));
    gr.addColorStop(1, hexLerp(P.ground,P.groundDark, fr(gy1)));
    ctx.fillStyle=gr; ctx.fillRect(0, gy0, VW, gy1-gy0);
    ctx.save();
    ctx.beginPath(); ctx.rect(0,gy0,VW,gy1-gy0); ctx.clip();
    for(const L of level.layers){
      let oy = -((cam.y*L.f) % LAYER_H); if(oy>0) oy-=LAYER_H;
      ctx.drawImage(L.cv, shx*L.f, oy);
      ctx.drawImage(L.cv, shx*L.f, oy+LAYER_H);
    }
    ctx.restore();
  }
  ctx.save();
  ctx.translate(Math.round(shx), Math.round(-cam.y+shy));
  // plankton
  ctx.fillStyle=P.paper;
  for(const m of level.motes){
    ctx.globalAlpha=0.25+Math.sin(m.ph+game.time)*0.15;
    ctx.fillRect(m.x,m.y,2.4,2.4);
  }
  ctx.globalAlpha=1;
  // dno
  ctx.drawImage(level.floor, 0, SURF+level.depth-10);
  drawPickups(ctx);
  for(const f of level.fishes) drawFish(ctx,f);
  for(const j of level.jellies) drawJelly(ctx,j);
  for(const m of level.mines) if(!m.gone) drawMine(ctx,m);
  for(const b of level.bubbles) drawBubble(ctx,b);
  drawBoss(ctx);
  drawWaterline();
  drawBlystka(ctx);
  drawParts(ctx);
  for(const f of floaters){
    ctx.globalAlpha=Math.min(1,(1.1-f.t)*2);
    txt(ctx,f.str,f.x,f.y,15,f.col);
    ctx.globalAlpha=1;
  }
  ctx.restore();
  drawHUD();
  // nakładki stanów
  if(game.state==='intro') drawIntro();
  if(game.state==='clear') drawClear();
  if(game.paused && game.state!=='help') drawPause();
  if(game.state==='gameover') drawGameOver();
  if(game.state==='victory') drawVictory();
}

// niebo nad taflą — słońce/lampa, chmury, sylwetki na horyzoncie
function drawSky(shx,wy){
  const P=level.pal, id=level.def.pal;
  ctx.save(); ctx.translate(shx,0);
  if(id===0||id===2){ // papierowe słońce z obracającymi się promieniami
    const cx= id===0? VW-180 : 220, cy=wy-300;
    ctx.fillStyle=P.paper;
    ctx.beginPath(); ctx.arc(cx,cy,46,0,6.283); ctx.fill();
    ctx.strokeStyle= id===0?P.accent:P.rust; ctx.lineWidth=3;
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(game.time*0.15);
    for(let i=0;i<10;i++){ const a=i/10*6.283;
      ctx.beginPath(); ctx.moveTo(Math.cos(a)*54,Math.sin(a)*54);
      ctx.lineTo(Math.cos(a)*63,Math.sin(a)*63); ctx.stroke(); }
    ctx.restore();
  }else{ // mosiężna lampa-księżyc na sznurku
    const cx=VW*0.5, cy=wy-300;
    ctx.strokeStyle=P.ink; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(cx,cy-160); ctx.lineTo(cx,cy-26); ctx.stroke();
    ctx.fillStyle=P.accent; ctx.beginPath(); ctx.arc(cx,cy,32,0,6.283); ctx.fill();
    ctx.globalAlpha=.15; ctx.beginPath(); ctx.arc(cx,cy,66,0,6.283); ctx.fill(); ctx.globalAlpha=1;
  }
  // papierowe chmury dryfujące
  ctx.fillStyle=P.paper; ctx.globalAlpha=.8;
  for(let i=0;i<4;i++){
    const cx=((game.time*8*(0.5+hash01(i,2)) + hash01(i,1)*VW*2)%(VW+240))-120;
    const cy=wy-340+hash01(i,3)*110;
    for(let k=0;k<4;k++){ ctx.beginPath(); ctx.arc(cx+k*22-30, cy+((k%2)*6), 14+hash01(i,k)*8, 0,6.283); ctx.fill(); }
  }
  ctx.globalAlpha=1;
  // horyzont: latarnia morska i papierowe żagle
  ctx.fillStyle=P.far;
  const hy=wy-1;
  ctx.beginPath(); ctx.moveTo(60,hy); ctx.lineTo(74,hy-64); ctx.lineTo(96,hy-64); ctx.lineTo(110,hy); ctx.closePath(); ctx.fill();
  ctx.fillStyle=P.accent; ctx.globalAlpha=.9; ctx.fillRect(76,hy-77,18,11); ctx.globalAlpha=1;
  ctx.fillStyle=P.far;
  for(let i=0;i<3;i++){ const bx=VW*0.30+i*170+hash01(i,5)*60;
    ctx.beginPath(); ctx.moveTo(bx,hy); ctx.lineTo(bx,hy-32); ctx.lineTo(bx+22,hy-6); ctx.closePath(); ctx.fill(); }
  ctx.restore();
}
// tafla wody — falująca pianka (współrzędne świata)
function drawWaterline(){
  const P=level.pal;
  ctx.strokeStyle=P.top; ctx.lineWidth=4; ctx.globalAlpha=.9;
  ctx.beginPath();
  for(let x=0;x<=VW;x+=16){
    const y=SURF+Math.sin(x*0.03+game.time*2.2)*2.6;
    if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.strokeStyle=P.ink; ctx.globalAlpha=.25; ctx.lineWidth=2;
  ctx.beginPath();
  for(let x=0;x<=VW;x+=16){
    const y=SURF+4+Math.sin(x*0.03+game.time*2.2+1)*2.2;
    if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke(); ctx.globalAlpha=1;
}

// ---------- BŁYSTKA: rysowanie ----------
function drawBoatAndGirl(g,x,y,face,rodBend,reeling){
  const P=level&&level.pal?level.pal:PALS[0];
  g.save(); g.translate(x,y); g.rotate(Math.sin(game.time*1.6+1)*0.03);
  // kadłub z papieru
  g.fillStyle=P.paper;
  g.beginPath();
  g.moveTo(-46,-6); g.lineTo(46,-6); g.lineTo(30,12); g.quadraticCurveTo(0,18,-30,12); g.closePath(); g.fill();
  g.strokeStyle=P.ink; g.globalAlpha=.65; g.lineWidth=2;
  g.beginPath();
  g.moveTo(-46,-6); g.lineTo(46,-6); g.lineTo(30,12); g.quadraticCurveTo(0,18,-30,12); g.closePath(); g.stroke();
  g.globalAlpha=1;
  g.fillStyle=P.rust; g.globalAlpha=.8; g.fillRect(-42,-6,84,3); g.globalAlpha=1;
  g.fillStyle=P.paper;
  g.beginPath(); g.moveTo(face*46,-6); g.lineTo(face*26,-6); g.lineTo(face*34,4); g.closePath(); g.fill();
  // Błystka — cynowa dziewczynka w chustce
  g.save(); g.scale(face,1);
  g.fillStyle=P.rust;
  rrPath(g,-8,-24,16,17,5); g.fill();
  g.strokeStyle=P.ink; g.globalAlpha=.5; rrPath(g,-8,-24,16,17,5); g.stroke(); g.globalAlpha=1;
  g.fillStyle=P.paper;
  g.beginPath(); g.arc(0,-32,10,0,6.283); g.fill();
  g.strokeStyle=P.ink; g.globalAlpha=.6; g.beginPath(); g.arc(0,-32,10,0,6.283); g.stroke(); g.globalAlpha=1;
  g.fillStyle=P.accent; // chustka
  g.beginPath(); g.arc(0,-34,10, 3.34, 6.08); g.fill();
  g.beginPath(); g.moveTo(-8,-40); g.lineTo(-16,-31); g.lineTo(-8,-30); g.closePath(); g.fill();
  g.fillStyle=P.ink;   // oko (mruga)
  if(player.blinkT>0){ g.beginPath(); g.arc(4,-32,1.6,0,6.283); g.fill(); }
  else{ g.strokeStyle=P.ink; g.lineWidth=1.4; g.beginPath(); g.moveTo(2,-32); g.lineTo(6.5,-32); g.stroke(); }
  g.fillStyle=P.rust; g.globalAlpha=.4; g.beginPath(); g.arc(6.6,-28.5,1.8,0,6.283); g.fill(); g.globalAlpha=1;
  // wędka i kołowrotek
  g.strokeStyle=P.ink; g.lineWidth=2.6; g.lineCap='round';
  g.beginPath(); g.moveTo(4,-18); g.quadraticCurveTo(16,-32, 24,-28+rodBend); g.stroke(); g.lineCap='butt';
  g.fillStyle=P.accent; g.beginPath(); g.arc(8,-16,3.4,0,6.283); g.fill();
  g.strokeStyle=P.ink; g.globalAlpha=.6;
  g.beginPath(); g.arc(8,-16,3.4,0,6.283); g.stroke();
  g.save(); g.translate(8,-16); g.rotate(reeling? game.time*14 : 0);
  g.beginPath(); g.moveTo(0,0); g.lineTo(0,-4.6); g.stroke(); g.restore();
  g.globalAlpha=1;
  g.restore();
  g.restore();
}
function drawBlystka(g){
  const p=player, P=level.pal;
  const by=SURF-8+Math.sin(game.time*1.6)*2.4;
  const tip=rodTip();
  // żyłka — od czubka wędki do haczyka
  if(p.phase!=='boat'){
    const h=p.hook;
    const sag = p.phase==='reel'? 6 : clamp(46-Math.abs(h.vy)*0.06, 8, 46);
    g.strokeStyle=P.ink; g.globalAlpha=.75; g.lineWidth=1.6;
    g.beginPath(); g.moveTo(tip.x,tip.y);
    g.quadraticCurveTo((tip.x+h.x)/2, (tip.y+h.y)/2 + sag, h.x, h.y-7);
    g.stroke(); g.globalAlpha=1;
  }
  drawBoatAndGirl(g, p.x, by, p.face, p.rodBend, p.phase==='reel');
  // haczyk z błystką
  if(p.phase!=='boat'){
    const h=p.hook;
    g.save(); g.translate(h.x,h.y);
    if(p.inv>0 && Math.sin(game.time*24)>0) g.globalAlpha=0.35;
    if(p.pow>0){ g.save(); g.fillStyle=P.accent; g.globalAlpha=.16+Math.sin(game.time*6)*.06;
      g.beginPath(); g.arc(0,0,26,0,6.283); g.fill(); g.restore(); }
    g.rotate(Math.sin(game.time*3)*0.15 + h.vx*0.0006);
    g.fillStyle=P.accent; // łyżeczka błystki
    g.beginPath(); g.ellipse(0,-4,3.6,7,0,0,6.283); g.fill();
    g.strokeStyle=P.ink; g.globalAlpha=.6;
    g.beginPath(); g.ellipse(0,-4,3.6,7,0,0,6.283); g.stroke(); g.globalAlpha=1;
    g.strokeStyle=P.paper; g.lineWidth=2.4; g.lineCap='round'; // hak
    g.beginPath(); g.moveTo(0,2); g.lineTo(0,7); g.arc(-3.6,7,4.4, 0, 2.6); g.stroke(); g.lineCap='butt';
    g.fillStyle=P.rust; g.globalAlpha=.9; // piórko
    g.beginPath(); g.ellipse(3.4,-9,2,4.6, .5+Math.sin(game.time*5)*.2, 0,6.283); g.fill(); g.globalAlpha=1;
    g.restore();
    // złowione ryby dyndają pod haczykiem
    const n=Math.min(8,p.hooked.length);
    for(let i=0;i<n;i++){
      const f=p.hooked[i];
      const fx=h.x+Math.sin(game.time*5+i*1.7)*6;
      const fy=h.y+16+i*15;
      const cl={k:f.k,w:f.w,h:f.h,x:0,y:0,dir:1,ph:f.ph,t:game.time};
      g.save(); g.translate(fx,fy); g.rotate(-1.35+Math.sin(game.time*6+i)*0.15);
      drawFish(g,cl,0.8);
      g.restore();
    }
    if(p.hooked.length>8) txt(g,'+'+(p.hooked.length-8), h.x+20, h.y+16+7*15, 13, P.paper);
  }
}

// ---------- HUD ----------
function drawHUD(){
  const P=level.pal;
  if(game.state==='victory'||game.state==='gameover') return;
  // serca / perły / głębokość / magnes — na dotyku odsunięte w dół, żeby nie nachodzić na przycisk wyciszenia w rogu
  const topL = Touch2.enabled ? 78 : 26;
  for(let i=0;i<3;i++) drawHeartIcon(ctx, 28+i*28, topL, 1.3, i<game.hearts);
  drawPearlIcon(ctx, 30, topL+32, 1, 0);
  txt(ctx,'× '+game.pearls, 46,topL+32,17,P.paper,'left');
  const under=player.phase==='drop'||player.phase==='reel';
  if(under){
    const m=((player.hook.y-SURF)/32)|0;
    txt(ctx, Math.max(0,m)+' m', 30, topL+60, 15, P.paper,'left');
  }
  // magnes z cyny
  if(player.pow>0){
    const yy=topL+(under?84:58);
    drawMagnetIcon(ctx,30,yy+2,0.85,P);
    ctx.fillStyle=P.ink; ctx.globalAlpha=.4; ctx.fillRect(46,yy-2,80,8); ctx.globalAlpha=1;
    ctx.fillStyle=P.accent; ctx.fillRect(46,yy-2,80*(player.pow/12),8);
    ctx.strokeStyle=P.ink; ctx.strokeRect(46.5,yy-1.5,79,7);
  }
  // połów i wynik — na dotyku odsunięte w dół, żeby nie nachodzić na przycisk pauzy w rogu
  const hudTop = Touch2.enabled ? 78 : 26;
  if(!level.isBoss){
    const cur=game.score-game.scoreAtStart, tgt=level.def.target;
    txt(ctx,'POŁÓW '+cur+' / '+tgt, VW-24,hudTop,17, cur>=tgt?P.accent:P.paper,'right');
    txt(ctx,'WYNIK '+game.score, VW-24,hudTop+26,13,P.paper,'right');
  }else
    txt(ctx,'WYNIK '+game.score, VW-24,hudTop,17,P.paper,'right');
  // pasek bossa
  const b=level.boss;
  if(b && b.active && !b.gone && b.state!=='dying'){
    txt(ctx,'SUMOR',VW/2,VH-44,16,P.paper);
    for(let i=0;i<b.maxHp;i++){
      const x=VW/2-(b.maxHp-1)*13+i*26;
      ctx.fillStyle= i<b.hp?'#c9574a':P.mid;
      ctx.beginPath(); ctx.arc(x,VH-22,8,0,6.283); ctx.fill();
      ctx.strokeStyle=P.ink; ctx.globalAlpha=.6;
      ctx.beginPath(); ctx.arc(x,VH-22,8,0,6.283); ctx.stroke(); ctx.globalAlpha=1;
    }
  }
}

function dim(a){ ctx.fillStyle='rgba(8,12,14,'+a+')'; ctx.fillRect(0,0,VW,VH); }
function drawIntro(){
  const P=level.pal, k=clamp(game.timer*3,0,1);
  ctx.globalAlpha=k*0.75; dim(0.75); ctx.globalAlpha=1;
  ctx.globalAlpha=k;
  wobTxt(ctx, level.def.name, VW/2, VH/2-40, 44, P.paper, P.ink);
  txt(ctx, level.def.hint, VW/2, VH/2+18, 19, P.accent);
  if(game.abil.dash && game.levelIdx===1)
    txt(ctx,'(zryw działa w dół i w górę — i zapewnia chwilową nietykalność)',VW/2,VH/2+50,14,P.paper);
  txt(ctx, Touch2.enabled ? 'dotknij ekranu, aby rozpocząć' : 'spacja / enter — start', VW/2, VH-60, 14, P.paper);
  txt(ctx,(Touch2.enabled?'dotknij ikonę ?':'H')+' — jak grać',VW/2,VH-34,14,P.accent);
  ctx.globalAlpha=1;
}
function drawClear(){
  const P=level.pal, k=clamp(game.timer*2.5,0,1);
  ctx.globalAlpha=k;
  wobTxt(ctx, level.isBoss?'GŁĘBIA POKONANA!':'PEŁNA SIEĆ!', VW/2, VH*0.30, 46, P.accent, P.ink);
  ctx.globalAlpha=1;
}
function drawPause(){
  dim(0.66);
  const P=level.pal;
  wobTxt(ctx,'PAUZA',VW/2,VH/2-70,52,P.paper,P.ink);
  txt(ctx,'ESC — wznów',VW/2,VH/2+4,20,P.paper);
  txt(ctx,'R — restart łowiska',VW/2,VH/2+38,20,P.paper);
  txt(ctx,'M — powrót do menu',VW/2,VH/2+72,20,P.paper);
  txt(ctx,(Touch2.enabled?'H / ?':'H')+' — jak grać',VW/2,VH/2+106,20,P.accent);
  txt(ctx,(Touch2.enabled?'V / 🔊':'V')+(Audio2.muted?' — włącz dźwięk':' — wycisz dźwięk'),VW/2,VH/2+140,20,P.paper);
}
function drawGameOver(){
  dim(Math.min(0.78,game.timer));
  const P=PALS[0];
  wobTxt(ctx,'ŻYŁKA PĘKŁA…',VW/2,VH/2-70,46,'#c9574a',P.ink);
  txt(ctx,'morze tym razem wygrało',VW/2,VH/2-22,18,P.paper);
  txt(ctx,'WYNIK: '+game.score+'   •   PERŁY: '+game.pearls,VW/2,VH/2+22,19,P.accent);
  txt(ctx,'ENTER — spróbuj jeszcze raz   •   M — menu',VW/2,VH/2+70,17,P.paper);
}
function drawVictory(){
  dim(Math.min(0.6,game.timer*0.5));
  const P=PALS[0];
  wobTxt(ctx,'MORZE JAŚNIEJE!',VW/2,VH/2-90,52,P.accent,P.ink);
  txt(ctx,'Błystka wyłowiła światło z głębin.',VW/2,VH/2-34,20,P.paper);
  txt(ctx,'WYNIK: '+game.score,VW/2,VH/2+14,26,P.paper);
  txt(ctx,'zebrane perły: '+game.pearls+'   •   rekord: '+game.best,VW/2,VH/2+52,17,P.accent);
  txt(ctx,'ENTER — menu',VW/2,VH/2+100,17,P.paper);
}
function drawHelp(){
  const P=PALS[0];
  dim(0.74);
  wobTxt(ctx,'JAK GRAĆ',VW/2,56,44,P.paper,P.ink);
  txt(ctx,'W DÓŁ omijaj ryby — dotknięcie ryby zahacza ją i rozpoczyna zwijanie.',VW/2,100,16,P.accent);
  txt(ctx,'W GÓRĘ łap wszystko — każda złowiona ryba liczy się do wyniku.',VW/2,130,16,P.accent);
  txt(ctx,'S / ↓ przyspiesza opadanie haczyka.',VW/2,160,15,P.paper);
  txt(ctx,'Na powierzchni podliczasz połów — im więcej ryb złowisz naraz, tym większy bonus!',VW/2,190,15,P.paper);
  txt(ctx,'Meduzy i miny zabierają serce i zrzucają część ryb z haczyka (masz 3 życia).',VW/2,220,15,P.paper);
  txt(ctx,'Zbieraj perły i serca, a magnes przez chwilę przyciąga ryby i perły do haczyka.',VW/2,250,15,P.paper);
  txt(ctx,'Od 2. łowiska: zryw (SPACJA pod wodą) daje błyskawiczny unik i chwilową nietykalność.',VW/2,280,15,P.paper);
  txt(ctx,'Cel: zdobądź wymagany połów w każdym łowisku — na końcu czeka SUMOR z głębin.',VW/2,310,15,P.paper);
  if(Touch2.enabled)
    txt(ctx,'przyciski: ◀ ▶ — ruch      haczyk — zarzuć i zryw      ▐▌ — pauza',VW/2,444,15,P.paper);
  else
    txt(ctx,'←→ / AD — ruch      SPACJA / W — zarzuć i zryw      ESC — pauza',VW/2,444,15,P.paper);
  txt(ctx,(Touch2.enabled?'dotknij ekranu':'ENTER / ESC')+' — wróć do menu',VW/2,478,16,P.accent);
}

// ---------- EKRAN TYTUŁOWY ----------
function renderTitle(){
  const P=PALS[0];
  // słońce z obracającymi się promieniami za logo
  ctx.save(); ctx.translate(VW/2,150); ctx.rotate(game.time*0.15);
  ctx.fillStyle=P.paper; ctx.globalAlpha=.9;
  ctx.beginPath(); ctx.arc(0,0,86,0,6.283); ctx.fill(); ctx.globalAlpha=1;
  ctx.strokeStyle=P.accent; ctx.lineWidth=5;
  for(let i=0;i<12;i++){ const a=i/12*6.283;
    ctx.beginPath(); ctx.moveTo(Math.cos(a)*100,Math.sin(a)*100);
    ctx.lineTo(Math.cos(a)*126,Math.sin(a)*126); ctx.stroke(); }
  ctx.restore();
  // chmury
  ctx.fillStyle=P.paper; ctx.globalAlpha=.8;
  for(let i=0;i<4;i++){
    const cx=((game.time*10*(0.5+hash01(i,2)) + hash01(i,1)*VW*2)%(VW+240))-120;
    const cy=54+hash01(i,3)*90;
    for(let k=0;k<4;k++){ ctx.beginPath(); ctx.arc(cx+k*22-30, cy+((k%2)*6), 15+hash01(i,k)*8, 0,6.283); ctx.fill(); }
  }
  ctx.globalAlpha=1;
  // morze — trzy falujące pasy atramentu
  const seaY=396;
  const cols=[P.ground, hexLerp(P.ground,P.groundDark,0.45), hexLerp(P.ground,P.groundDark,0.8)];
  for(let b=0;b<3;b++){
    ctx.fillStyle=cols[b];
    ctx.beginPath(); ctx.moveTo(0,VH);
    for(let x=0;x<=VW;x+=20)
      ctx.lineTo(x, seaY+b*36+Math.sin(x*0.016+game.time*(1.2+b*0.35)+b*2)*6);
    ctx.lineTo(VW,VH); ctx.closePath(); ctx.fill();
  }
  ctx.strokeStyle=P.top; ctx.lineWidth=3; ctx.globalAlpha=.9;
  ctx.beginPath();
  for(let x=0;x<=VW;x+=20){ const y=seaY+Math.sin(x*0.016+game.time*1.2)*6;
    if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); }
  ctx.stroke(); ctx.globalAlpha=1;
  // skacząca rybka
  if(title.jump){
    const j=title.jump, t=j.t;
    const cl={k:'plotka',w:26,h:13, x:j.x+j.dir*90*t, y:seaY-Math.sin(t*Math.PI)*72, dir:j.dir, ph:0, t:game.time};
    drawFish(ctx, cl, 1, (t-0.5)*1.7*j.dir);
  }
  // łódka z Błystką na fali + żyłka ze spławikiem
  const bx=VW*0.68, byy=seaY+6+Math.sin(game.time*1.3)*4;
  ctx.strokeStyle=P.ink; ctx.globalAlpha=.7; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.moveTo(bx-24,byy-28);
  ctx.quadraticCurveTo(bx-52,byy-6, bx-64, byy+10+Math.sin(game.time*1.5)*3);
  ctx.stroke(); ctx.globalAlpha=1;
  ctx.fillStyle=P.rust;
  ctx.beginPath(); ctx.arc(bx-64, byy+10+Math.sin(game.time*1.5)*3, 4,0,6.283); ctx.fill();
  ctx.fillStyle=P.paper;
  ctx.beginPath(); ctx.arc(bx-64, byy+8+Math.sin(game.time*1.5)*3, 4, 3.14,6.283); ctx.fill();
  drawBoatAndGirl(ctx, bx, byy, -1, 0, false);
  // LOGO
  wobTxt(ctx,'BŁYSTKA',VW/2,150,92,P.rust,P.ink);
  txt(ctx,'i  M o r z e  A t r a m e n t u',VW/2,222,26,P.ink);
  drawHookIcon(ctx,VW/2-196,150,2.2,P);
  drawHookIcon(ctx,VW/2+198,152,2.2,P);
  // napisy
  const sv=game.saveData;
  if(((game.time*1.4)|0)%2===0){
    if(sv) txt(ctx,(Touch2.enabled?'dotknij ekranu':'ENTER')+' — kontynuuj: '+LEVELS[sv.lvl].name, VW/2,330,20,P.ink);
    else txt(ctx, Touch2.enabled?'— dotknij ekranu —':'— naciśnij ENTER —', VW/2,330,22,P.ink);
  }
  if(sv) txt(ctx,(Touch2.enabled?'dotknij tutaj':'N')+' — nowa wyprawa od początku', VW/2,372,15,P.rust);
  txt(ctx,(Touch2.enabled?'dotknij ikonę ?':'H')+' — jak grać',VW/2,410,15,P.paper);
  if(!Touch2.enabled) txt(ctx,'V — wycisz / włącz dźwięk',VW/2,440,14,P.paper);
  if(Touch2.enabled){
    txt(ctx,'przyciski: ◀ ▶ — ruch      haczyk — zarzuć i zryw      ▐▌ — pauza',VW/2,486,15,P.paper);
    if(window.innerHeight>window.innerWidth)
      txt(ctx,'(obróć telefon poziomo!)',VW/2,300,17,P.rust);
  }else
    txt(ctx,'←→ / AD — ruch      SPACJA / W — zarzuć i zryw      ESC — pauza',VW/2,486,15,P.paper);
  txt(ctx,'w dół omijaj ryby • w górę łap wszystko • zbieraj perły z toni',VW/2,514,13,P.paper);
  if(game.best>0) txt(ctx,'rekord: '+game.best,VW-24,26,15,P.ink,'right');
  txt(ctx,'Stworzone przez Wojtoteka',24,26,13,P.ink,'left');
  drawParts(ctx);
}

// ---------- PĘTLA GŁÓWNA (stały krok 60 Hz) ----------
let last=performance.now(), acc=0;
function frame(now){
  requestAnimationFrame(frame);
  let ft=(now-last)/1000; last=now;
  if(ft>0.1) ft=0.1;
  acc+=ft;
  while(acc>=DT){
    update(DT);
    Input.endFrame();
    acc-=DT;
  }
  render();
}
// start!
viewReady=true; fitCanvas();
toTitle();
game.best = game.best|0;
requestAnimationFrame(frame);
// uchwyt do testów
window.__game={game, get level(){return level;}, get player(){return player;}, loadLevel, Music, hurtPlayer, Input, tallyCatch, startClear, LEVELS, SURF};
</script>
