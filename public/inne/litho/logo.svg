<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Litho Studio">
  <title>Litho Studio</title>
  <desc>
    Znak łączy nawias kodu &lt; / &gt; z kursorem myszy — przejście od kodu do edycji
    wizualnej i z powrotem.
  </desc>

  <defs>
    <linearGradient id="litho-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6E56CF" />
      <stop offset="100%" stop-color="#4F8FFF" />
    </linearGradient>
  </defs>

  <!-- Nawiasy kodu -->
  <g
    fill="none"
    stroke="url(#litho-gradient)"
    stroke-width="3.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M12 15 L5 24 L12 33" />
    <path d="M36 15 L43 24 L36 33" />
  </g>

  <!-- Kursor w miejscu ukośnika -->
  <path
    d="M18 12 L18 34 L22.6 29.4 L26 36.5 L29.4 34.9 L26.1 28 L32 27.6 Z"
    fill="url(#litho-gradient)"
  />
</svg>
