<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags -->
    <title>Kontakt - Wojtoteka | Formularz Kontaktowy</title>
    <meta name="description" content="Skontaktuj się z Wojtoteka poprzez formularz kontaktowy lub email: kontakt@wojtoteka.ovh. Odpowiadam na wszystkie wiadomości najszybciej jak to możliwe!">
    <meta name="keywords" content="kontakt Wojtoteka, formularz kontaktowy, kontakt@wojtoteka.ovh, napisz do nas, współpraca, wsparcie">

    <meta property="og:description" content="Skontaktuj się z Wojtoteka poprzez formularz kontaktowy lub email: kontakt@wojtoteka.ovh">
    <meta property="og:image" content="https://wojtoteka.ovh/img/logo.png">
    <meta property="og:locale" content="pl_PL">
    <meta property="og:site_name" content="Wojtoteka - Kontakt">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://wojtoteka.ovh/kontakt.html">
    <meta name="twitter:title" content="Kontakt - Wojtoteka">
    <meta name="twitter:description" content="Skontaktuj się z Wojtoteka poprzez formularz kontaktowy lub email: kontakt@wojtoteka.ovh">
    <meta name="twitter:image" content="https://wojtoteka.ovh/img/logo.png">
    
    <!-- Additional Meta -->
    <meta name="theme-color" content="#ff9800">

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ContactPage",
      "name": "Kontakt - Wojtoteka",
      "url": "https://wojtoteka.ovh/kontakt.html",
      "description": "Formularz kontaktowy do Wojtoteka. Napisz do nas i otrzymaj odpowiedź najszybciej jak to możliwe.",
      "inLanguage": "pl-PL",
      "mainEntity": {
        "@type": "Organization",
        "name": "Wojtoteka",
        "url": "https://wojtoteka.ovh/",
        "email": "kontakt@wojtoteka.ovh",
        "contactPoint": {
          "@type": "ContactPoint",
          "email": "kontakt@wojtoteka.ovh",
          "contactType": "Customer Service",
          "availableLanguage": ["Polish"]
        }
      }
    }
    </script>
    
    <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
            overflow-x: hidden;
            background: #050505;
        }

        #background-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            object-fit: cover;
            filter: brightness(30%) saturate(1.3) contrast(1.1);
        }

        .noise {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            z-index: 1;
            pointer-events: none;
            opacity: 0.035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 128px 128px;
        }

        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.6) 100%);
        }

        .ambient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            background:
                radial-gradient(600px circle at var(--mx, 50%) var(--my, 40%), rgba(255,152,0,0.06) 0%, transparent 60%);
            transition: background 0.3s ease;
        }

        .container {
            z-index: 10;
            width: 88%;
            max-width: 600px;
            padding: 40px 36px;
            border-radius: 24px;
            background: rgba(10, 10, 10, 0.55);
            backdrop-filter: blur(20px) saturate(1.4);
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
            animation: containerIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            margin: 20px;
        }

        @keyframes containerIn {
            from { opacity: 0; transform: translateY(30px) scale(0.95); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        h1 {
            font-size: 2.2em;
            font-weight: 800;
            margin: 0 0 6px;
            opacity: 0;
            animation: rise 0.6s 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .accent-line {
            width: 50px;
            height: 3px;
            margin: 10px auto 14px;
            border-radius: 2px;
            background: linear-gradient(90deg, #ff9800, #ff6d00);
            opacity: 0;
            animation: lineIn 0.6s 0.45s ease forwards;
        }

        @keyframes lineIn {
            from { opacity: 0; width: 0; }
            to { opacity: 1; width: 50px; }
        }

        p.subtitle {
            font-size: 0.92em;
            margin: 0 0 20px;
            color: rgba(255, 255, 255, 0.45);
            letter-spacing: 0.5px;
            opacity: 0;
            animation: rise 0.5s 0.5s ease forwards;
        }

        .back-link-wrapper {
            text-align: left;
            margin-bottom: 16px;
        }

        .back-link {
            display: inline-block;
            color: rgba(255, 183, 77, 0.85);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9em;
            padding: 8px 16px;
            border-radius: 10px;
            background: rgba(255, 152, 0, 0.08);
            border: 1px solid rgba(255, 152, 0, 0.15);
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .back-link:hover {
            background: rgba(255, 152, 0, 0.18);
            border-color: rgba(255, 152, 0, 0.35);
            color: #ff9800;
            transform: translateX(-4px);
        }

        .contact-form {
            margin-top: 20px;
            opacity: 0;
            animation: rise 0.5s 0.6s ease forwards;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 600;
            font-size: 0.88em;
            letter-spacing: 0.3px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 13px 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-size: 0.95em;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-sizing: border-box;
            backdrop-filter: blur(8px);
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: rgba(255, 152, 0, 0.5);
            background: rgba(255, 255, 255, 0.09);
            box-shadow: 0 0 20px rgba(255, 152, 0, 0.08);
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
            font-family: inherit;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .captcha-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, rgba(255, 152, 0, 0.7), rgba(255, 109, 0, 0.7));
            color: #fff;
            border: 1px solid rgba(255, 183, 77, 0.2);
            border-radius: 12px;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.15);
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, rgba(255, 152, 0, 0.9), rgba(255, 109, 0, 0.9));
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 25px rgba(255, 152, 0, 0.3);
        }

        .submit-btn:disabled {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.06);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .email-info {
            margin-top: 28px;
            padding: 18px;
            background: rgba(255, 152, 0, 0.06);
            border-radius: 14px;
            border: 1px solid rgba(255, 152, 0, 0.15);
            border-left: 3px solid rgba(255, 152, 0, 0.5);
            opacity: 0;
            animation: rise 0.5s 0.8s ease forwards;
        }

        .email-info p {
            margin: 5px 0;
            opacity: 1;
            animation: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9em;
        }

        .email-info a {
            color: rgba(255, 183, 77, 0.9);
            text-decoration: none;
            font-weight: 700;
            transition: color 0.3s ease;
        }

        .email-info a:hover {
            color: #ff9800;
        }

        .message {
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 0.92em;
            animation: rise 0.4s ease-out;
        }

        .message.success {
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid rgba(76, 175, 80, 0.25);
            color: #81C784;
        }

        .message.error {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid rgba(244, 67, 54, 0.25);
            color: #E57373;
        }

        .footer {
            font-size: 0.72em;
            color: rgba(255, 255, 255, 0.2);
            position: relative;
            width: 100%;
            text-align: center;
            padding: 16px 0 20px;
            opacity: 0;
            animation: fadeIn 1s 1.2s ease-out forwards;
            z-index: 10;
            flex-shrink: 0;
        }

        .footer a {
            color: rgba(255, 152, 0, 0.4);
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer a:hover {
            color: rgba(255, 152, 0, 0.7);
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 768px) {
            body, html {
                justify-content: flex-start;
            }
            .container {
                padding: 28px 20px;
                width: 94%;
                margin: 20px 10px 10px;
                border-radius: 18px;
            }
            h1 { font-size: 1.6em; }
            .form-group input,
            .form-group textarea {
                padding: 11px 14px;
                font-size: 1em;
            }
            .form-group textarea {
                min-height: 100px;
            }
            .submit-btn {
                padding: 13px;
            }
            .email-info {
                margin-top: 20px;
                padding: 14px;
            }
            .captcha-container {
                transform: scale(0.9);
                transform-origin: center;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px 16px;
                width: 96%;
                margin: 12px 8px 8px;
                border-radius: 16px;
            }
            h1 { font-size: 1.4em; }
            p.subtitle { font-size: 0.85em; }
            .captcha-container {
                transform: scale(0.82);
                transform-origin: center;
            }
        }

        ::-webkit-scrollbar { width: 8px; background: transparent; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(135deg, #ff9800, #ffcc80); border-radius: 8px; }
        html { scrollbar-width: thin; scrollbar-color: #ff9800 transparent; }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline id="background-video">
        <source src="img/tlow.mp4" type="video/mp4">
    </video>

    <div class="noise"></div>
    <div class="vignette"></div>
    <div class="ambient"></div>

    <div class="container">
        <div class="back-link-wrapper">
            <a href="/" class="back-link">← Strona główna</a>
        </div>
        <h1>📧 Kontakt</h1>
        <div class="accent-line"></div>
        <p class="subtitle">Wypełnij formularz, a skontaktuję się z Tobą najszybciej jak to możliwe!</p>

        <div id="statusMessage"></div>

        <form class="contact-form" id="contactForm" method="POST">
            <div class="form-group">
                <label for="name">Nazwa / Imię:</label>
                <input type="text" id="name" name="name" placeholder="Wpisz swoje imię" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="twoj@email.com" required>
            </div>

            <div class="form-group">
                <label for="subject">Temat:</label>
                <input type="text" id="subject" name="subject" placeholder="Temat wiadomości" required>
            </div>

            <div class="form-group">
                <label for="message">Treść wiadomości:</label>
                <textarea id="message" name="message" placeholder="Wpisz swoją wiadomość..." required></textarea>
            </div>

            <div class="captcha-container">
                <div class="h-captcha" data-sitekey="db90b3e2-841e-418a-b3ce-d33a319256d2"></div>
            </div>

            <p style="font-size: 0.78em; color: rgba(255,255,255,0.4); text-align: center; margin: -8px 0 14px;">
                Wysyłając wiadomość akceptujesz <a href="/polityka-prywatnosci.html" style="color: rgba(255,183,77,0.85); font-weight: 600;">Politykę Prywatności</a>.
            </p>

            <button type="submit" class="submit-btn">Wyślij wiadomość 🚀</button>
        </form>

        <div class="email-info">
            <p>💌 Możesz też napisać bezpośrednio na:</p>
            <p><a href="mailto:kontakt@wojtoteka.ovh">kontakt@wojtoteka.ovh</a></p>
        </div>
    </div>

    <div class="footer">
        <p>&copy; <a href="https://wojtoteka.ovh">Wojtoteka.ovh</a> 2024-<span id="current-year"></span></p>
    </div>

    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear();

        // Ambient glow follows mouse
        document.addEventListener('mousemove', (e) => {
            const x = ((e.clientX / window.innerWidth) * 100).toFixed(1);
            const y = ((e.clientY / window.innerHeight) * 100).toFixed(1);
            document.querySelector('.ambient').style.setProperty('--mx', x + '%');
            document.querySelector('.ambient').style.setProperty('--my', y + '%');
        });

        let csrfToken = '';
        async function fetchCsrfToken() {
            try {
                const response = await fetch('/api/csrf-token');
                const data = await response.json();
                csrfToken = data.csrfToken;
            } catch (error) {
                console.error('Error fetching CSRF token:', error);
            }
        }
        fetchCsrfToken();

        document.getElementById('contactForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const form = e.target;
            const submitBtn = form.querySelector('.submit-btn');
            const statusDiv = document.getElementById('statusMessage');

            const hcaptchaResponse = hcaptcha.getResponse();
            if (!hcaptchaResponse) {
                showMessage('error', '⚠️ Proszę wypełnić hCaptcha!');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Wysyłanie...';

            const formData = {
                name: form.name.value,
                email: form.email.value,
                subject: form.subject.value,
                message: form.message.value,
                hcaptchaToken: hcaptchaResponse,
                csrfToken: csrfToken
            };

            try {
                const response = await fetch('/api/contact', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': csrfToken
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (response.ok) {
                    showMessage('success', '✅ ' + result.message);
                    form.reset();
                    hcaptcha.reset();
                } else {
                    showMessage('error', '❌ ' + result.message);
                    hcaptcha.reset();
                }
            } catch (error) {
                showMessage('error', '❌ Wystąpił błąd podczas wysyłania wiadomości. Spróbuj ponownie.');
                hcaptcha.reset();
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Wyślij wiadomość 🚀';
            }
        });

        function showMessage(type, text) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.innerHTML = `<div class="message ${type}">${text}</div>`;
            
            setTimeout(() => {
                statusDiv.innerHTML = '';
            }, 5000);
        }
    </script>
    <script src="/js/announcements.js" defer></script>
</body>
</html>
